<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="omelette-owns-print" content="1">
<title>مستند فرآیندهای واحد سالن — اینجا فست‌فود</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#4A25A9; --ink:#2A1D5E; --deep:#2E1668; --coral:#FA5A52; --coral-ink:#E23D35;
    --app:#FBF7F1; --desk:#E7E1F2; --card:#fff; --v-soft:#F0E9FB; --v-softer:#F5F1FB; --c-soft:#FFE9E7;
    --bd:#EFE7DC; --bd-v:#E3D8F5; --hair:#F2ECE3;
    --muted:#8a7db0; --faint:#a99fc4; --body:#4A3F6B;
    --ok:#1F8A5B; --ok-s:#E4F6EC; --warn:#B4690E; --warn-s:#FBEEDC; --info:#1F6FB2; --info-s:#E7F1FB;
    --in-fg:#1F6FB2; --in-bg:#E7F1FB; --ctl-fg:#8A5A00; --ctl-bg:#FBF0DA;
    --out-fg:#1F8A5B; --out-bg:#E4F6EC; --mech-fg:#4A25A9; --mech-bg:#F0E9FB;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:'Vazirmatn',system-ui,sans-serif;background:var(--desk);color:var(--ink);line-height:1.75}
  ::selection{background:var(--coral);color:#fff}
  a{color:var(--violet);text-decoration:none}a:hover{color:var(--coral)}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:11px 24px;background:rgba(46,22,104,.96);backdrop-filter:blur(8px);color:#fff}
  .topbar img{width:30px;height:30px;border-radius:8px;object-fit:cover}
  .topbar .tt{font-weight:800;font-size:14px}
  .topbar .sp{flex:1}
  .topbar .updated{font-size:11.5px;color:#C9BBEE}
  .tbtn{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:12.5px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-family:inherit}
  .tbtn:hover{background:rgba(255,255,255,.18)}
  .tbtn.solid{background:#fff;color:var(--violet);border-color:#fff}

  .view{display:none}
  .view.print-only{display:none!important}
  .view.active{display:block}
  .toc-s{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px}
  .toc-group{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--faint);margin:22px 0 6px;padding-top:14px;border-top:1px solid var(--hair)}
  .toc li{align-items:flex-start!important}
  .toc .toc-t{flex:1}
  .toc .toc-lead{display:none}
  .backbar{display:flex;align-items:center;gap:10px;max-width:940px;margin:0 auto 14px}
  .backbtn{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px;border-radius:11px;padding:9px 15px;cursor:pointer;border:1.5px solid var(--bd-v);background:#fff;color:var(--violet);font-family:inherit;box-shadow:0 3px 12px -8px rgba(74,37,169,.5)}
  .backbtn:hover{background:var(--v-softer);border-color:var(--violet)}
  .doc{padding:30px 20px 80px}
  .sheet{background:#fff;width:100%;max-width:940px;margin:0 auto 26px;border-radius:18px;box-shadow:0 14px 48px -26px rgba(46,22,104,.5);padding:52px 58px;position:relative}
  .sheet.pad-sm{padding:40px 46px}

  /* cover */
  .cover-sheet{background:var(--deep);color:#fff;overflow:hidden;min-height:600px;display:flex;flex-direction:column;justify-content:center;padding:0}
  .cover-inner{position:relative;z-index:2;padding:64px 60px;text-align:center}
  .cover-blob{position:absolute;border-radius:50%;background:#3A1D85;opacity:.5}
  .cover-logo{width:96px;height:96px;border-radius:24px;object-fit:cover;box-shadow:0 20px 50px -18px rgba(0,0,0,.7);margin-bottom:30px}
  .cover-kicker{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:18px}
  .cover-kicker .bar{width:26px;height:2px;background:var(--coral);border-radius:2px}
  .cover-kicker span{font-size:12px;font-weight:700;letter-spacing:.16em;color:#B9A6EA;direction:ltr}
  .cover-sheet h1{font-size:46px;font-weight:900;line-height:1.25;margin:0;letter-spacing:-.01em}
  .cover-sheet .sub{font-size:17px;color:#C9BBEE;margin-top:16px;max-width:560px;margin-inline:auto;line-height:1.9}
  .cover-foot{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;margin-top:40px;padding-top:26px;border-top:1px solid rgba(255,255,255,.16)}
  .cover-foot .cf{font-size:12.5px;color:#B9A6EA}
  .cover-foot .cf b{display:block;color:#fff;font-size:15px;font-weight:800;margin-top:4px}

  /* section heading */
  .sec-num{font-family:var(--mono);font-size:13px;color:var(--coral);font-weight:700;direction:ltr}
  .sheet-head{display:flex;align-items:center;gap:13px;margin-bottom:8px}
  .sheet-head h2{font-size:27px;font-weight:800;margin:0}
  .sheet-head .hn{width:38px;height:38px;border-radius:11px;background:var(--v-soft);color:var(--violet);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--mono);font-size:14px;flex:none}
  .sheet-lead{font-size:13px;color:var(--muted);margin:0 0 26px 51px}
  .rule{height:1px;background:var(--hair);margin:22px 0}

  .prose{font-size:14px;color:var(--body);line-height:2.1;text-align:justify}
  .prose+.prose{margin-top:14px}

  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
  .stat{flex:1;min-width:120px;background:var(--v-softer);border:1px solid var(--bd-v);border-radius:16px;padding:16px 18px}
  .stat .n{font-weight:900;font-size:28px;color:var(--violet);line-height:1}
  .stat .l{font-size:12px;color:var(--muted);margin-top:7px;font-weight:600}

  /* TOC */
  .toc{list-style:none;margin:0;padding:0}
  .toc li{display:flex;align-items:baseline;gap:10px;padding:11px 4px;border-bottom:1px dashed var(--hair);cursor:pointer}
  .toc li:hover .toc-t{color:var(--coral)}
  .toc .toc-n{font-family:var(--mono);font-size:12px;color:var(--violet);font-weight:700;flex:none;width:26px}
  .toc .toc-t{font-size:14.5px;font-weight:700;color:var(--ink);flex:none;transition:color .14s}
  .toc .toc-lead{flex:1;border-bottom:2px dotted #D9CFEA;transform:translateY(-4px)}
  .toc .toc-pg{font-family:var(--mono);font-size:12px;color:var(--faint);flex:none}
  .toc-sub{margin-inline-start:36px}
  .toc-sub li{padding:8px 4px}
  .toc-sub .toc-t{font-weight:600;font-size:13px;color:var(--body)}

  /* legend */
  .legend-box{background:var(--v-softer);border:1px solid var(--bd-v);border-radius:16px;padding:20px 22px;margin-top:8px}
  .legend-box .lh{font-weight:800;font-size:14px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .legend-row{display:flex;align-items:center;gap:22px;padding:14px 0;border-bottom:1px solid var(--hair)}
  .legend-row:last-child{border-bottom:none}
  .lg-sym{width:44px;height:44px;position:relative;flex:none;margin-inline-end:4px}
  .lg-sym .sq{position:absolute;inset:0;transform:rotate(45deg);border-radius:8px;background:#fff;border:2.5px solid}
  .lg-sym .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
  .lg-txt .n{font-weight:800;font-size:14px;display:block;margin-bottom:4px}
  .lg-txt .d{font-size:12.5px;color:var(--muted);display:block}

  .grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}

  .unit .u-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
  .card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 3px 14px -10px rgba(74,37,169,.3)}
  .u-ic{width:30px;height:30px;border-radius:9px;background:var(--v-soft);color:var(--violet);display:flex;align-items:center;justify-content:center;flex:none}
  .u-desc{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.9}

  /* role cards */
  .role{border:1px solid var(--bd);border-radius:18px;padding:0;box-shadow:0 4px 18px -12px rgba(74,37,169,.35);margin-bottom:16px;overflow:hidden;break-inside:avoid}
  .role-head{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--v-softer);border-bottom:1px solid var(--bd-v)}
  .role-av{width:40px;height:40px;border-radius:11px;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .role-name{font-weight:800;font-size:16px}
  .role-tag{margin-inline-start:auto;font-size:11px;font-weight:700;color:var(--violet);background:#fff;border:1px solid var(--bd-v);border-radius:20px;padding:4px 10px}
  .role-body{padding:16px 20px}
  ul.duties{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
  ul.duties li{font-size:12.5px;color:var(--body);line-height:1.85;padding-inline-start:22px;position:relative}
  ul.duties li::before{content:'▪';position:absolute;inset-inline-start:2px;top:-1px;color:var(--coral);font-size:13px}

  /* KPI */
  .kpi-role{border:1px solid var(--bd);border-radius:16px;padding:18px 20px;margin-bottom:14px;background:#fff;break-inside:avoid}
  .kpi-role .kr-h{display:flex;align-items:center;gap:10px;margin-bottom:13px}
  .kpi-role .kr-av{width:32px;height:32px;border-radius:9px;background:var(--ok-s);color:var(--ok);display:flex;align-items:center;justify-content:center;flex:none}
  .kpi-role .kr-name{font-weight:800;font-size:15px}
  ul.kpis{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
  ul.kpis li{font-size:12.5px;color:var(--body);background:var(--ok-s);border-radius:10px;padding:10px 13px;line-height:1.8;position:relative;padding-inline-start:30px}
  ul.kpis li::before{content:'';position:absolute;inset-inline-start:12px;top:13px;width:9px;height:9px;border-radius:2px;background:var(--ok)}
  .kpi-none{font-size:12px;color:var(--faint);font-style:normal}

  /* process */
  .proc-num-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .id-badge{font-family:var(--mono);font-size:11.5px;color:#fff;background:var(--violet);padding:3px 9px;border-radius:6px;direction:ltr}
  .sub-badge{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-s);padding:3px 9px;border-radius:20px}
  .proc-summary{font-size:13.5px;color:var(--body);line-height:2.05;text-align:justify}
  .proc-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px}
  .pm{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .pm b{color:var(--violet);font-weight:800}
  .block-label{font-size:12.5px;font-weight:800;color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .block-label .sq{width:14px;height:14px;border-radius:4px;flex:none}

  /* IDEF0 A-0 diagram */
  .a0{display:grid;grid-template-columns:1fr minmax(260px,360px) 1fr;grid-template-rows:auto auto auto;gap:18px 20px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:24px 22px;box-shadow:0 3px 14px -10px rgba(74,37,169,.3)}
  .a0-ctl{grid-column:1/-1;grid-row:1;text-align:center}
  .a0-out{grid-column:1;grid-row:2}
  .a0-box{grid-column:2;grid-row:2;background:var(--violet);border-radius:16px;padding:20px 24px;text-align:center;box-shadow:0 14px 30px -16px rgba(74,37,169,.8)}
  .a0-in{grid-column:3;grid-row:2}
  .a0-mech{grid-column:1/-1;grid-row:3;text-align:center}
  .a0-title{font-weight:800;font-size:15px;color:#fff;line-height:1.7}
  .a0-id{font-family:var(--mono);font-size:11px;color:#C9BBEE;margin-top:8px}
  .a0-lab{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px}
  .a0-mech .a0-lab{margin:8px 0 0}
  .a0-out .a0-lab{text-align:left}
  .a0-chips{display:flex;flex-wrap:wrap;gap:7px}
  .a0-chips.ctr{justify-content:center}
  .a0-chips.end{justify-content:flex-start}
  .a0-chips.start{justify-content:flex-end}
  .chip.in{background:var(--in-bg);color:var(--in-fg)}
  .chip.ctl{background:var(--ctl-bg);color:var(--ctl-fg)}
  .chip.out{background:var(--out-bg);color:var(--out-fg)}
  .chip.mech{background:var(--mech-bg);color:var(--mech-fg)}
  @media(max-width:760px){
    .a0{grid-template-columns:1fr;gap:14px}
    .a0-ctl,.a0-out,.a0-box,.a0-in,.a0-mech{grid-column:1;grid-row:auto}
    .a0-chips{justify-content:flex-start!important}
  }

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;padding:4px 10px;border-radius:8px;line-height:1.6}
  .kpi-card{border:1px solid var(--bd);border-radius:14px;padding:15px 16px;background:#fff}
  .kpi-card .k-name{font-weight:800;font-size:13.5px;color:var(--ink);display:flex;align-items:flex-start;gap:8px}
  .kpi-card .k-def{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.8}
  .kpi-card .k-target{display:inline-flex;align-items:baseline;gap:5px;margin-top:12px;background:var(--v-soft);color:var(--violet);border-radius:9px;padding:6px 12px}
  .kpi-card .k-target b{font-size:18px;font-weight:800}.kpi-card .k-target .u{font-size:11px;font-weight:600;opacity:.8}
  .k-ic{width:26px;height:26px;border-radius:8px;background:var(--v-soft);color:var(--violet);display:flex;align-items:center;justify-content:center;flex:none;margin-top:-1px}

  .subchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-s);border-radius:20px;padding:5px 11px;margin:4px 6px 0 0;cursor:pointer}
  .subchip:hover{filter:brightness(.97)}

  .flowbtn{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;margin-top:24px;padding:16px 20px;border:1.5px solid var(--bd-v);background:#FAF7FF;border-radius:16px;cursor:pointer;font-family:inherit;transition:border-color .16s,box-shadow .16s;text-align:right}
  .flowbtn:hover{border-color:var(--violet);box-shadow:0 12px 28px -14px rgba(74,37,169,.5)}
  .flowbtn .fb-l{display:flex;align-items:center;gap:14px}
  .flowbtn .fb-ic{width:46px;height:46px;border-radius:13px;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .flowbtn .fb-t{font-weight:800;font-size:15px;color:var(--ink)}
  .flowbtn .fb-s{font-size:12px;color:var(--muted);margin-top:3px}
  .flowbtn .fb-go{width:38px;height:38px;border-radius:50%;background:var(--v-soft);color:var(--violet);display:flex;align-items:center;justify-content:center;flex:none}

  .divider-sheet{background:var(--violet);color:#fff;text-align:center;padding:70px 40px}
  .divider-sheet .dk{font-size:12px;font-weight:700;letter-spacing:.16em;color:#C9BBEE;direction:ltr;margin-bottom:14px}
  .divider-sheet h2{font-size:34px;font-weight:900;margin:0;color:#fff}
  .divider-sheet p{font-size:14px;color:#C9BBEE;margin-top:14px;max-width:520px;margin-inline:auto;line-height:1.9}

  /* ===== flow screen overlay ===== */
  .flowscreen{position:fixed;inset:0;z-index:100;background:var(--app);display:flex;flex-direction:column}
  .flowscreen[hidden]{display:none}
  .fs-top{display:flex;align-items:center;gap:12px;padding:12px 22px;background:#fff;border-bottom:1px solid var(--bd);flex:none;z-index:3}
  .fs-crumbs{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap;min-width:0;flex:1}
  .fs-crumbs .cr{color:var(--muted);cursor:pointer}
  .fs-crumbs .cr:hover{color:var(--violet)}
  .fs-crumbs .cr.cur{color:var(--ink);font-weight:800;cursor:default}
  .fs-crumbs .pid{font-family:var(--mono);font-size:11.5px;color:#fff;background:var(--violet);padding:3px 9px;border-radius:6px;direction:ltr;flex:none}
  .fs-crumbs .sep{color:var(--faint)}
  .fs-legend{display:flex;gap:14px}
  .fs-legend .lg{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:700}
  .fs-legend .d{width:13px;height:13px;transform:rotate(45deg);border-radius:3px}
  .zbtn{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--bd-v);background:#fff;color:var(--violet);font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .zbtn:hover{background:var(--v-softer)}
  .zlabel{font-size:11.5px;color:var(--muted);min-width:44px;text-align:center;font-family:var(--mono)}
  .fs-nav{display:flex;gap:8px}
  .fs-navb{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--bd-v);background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .fs-navb:hover:not(:disabled){background:var(--v-softer);color:var(--violet);border-color:var(--violet)}
  .fs-navb:disabled{color:#d5cee4;cursor:default}
  .fs-close{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--bd-v);background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .fs-close:hover{background:var(--c-soft);color:var(--coral-ink);border-color:#F5C9C5}
  .fs-hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:2;background:rgba(42,29,94,.9);color:#fff;font-size:11.5px;padding:7px 14px;border-radius:20px;pointer-events:none;transition:opacity .4s}
  .fs-stage{flex:1;position:relative;overflow:hidden;background:#FAF7F1;background-image:radial-gradient(#DED5E8 1.1px,transparent 1.1px);background-size:22px 22px;cursor:grab;touch-action:none}
  .fs-stage.grabbing{cursor:grabbing}
  .fs-canvas{position:absolute;top:0;right:0;transform-origin:top right}
  .fedges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  .fnode{position:absolute;min-width:132px;max-width:230px;width:max-content;background:#fff;border:1px solid #EFE9F6;border-radius:10px;padding:20px 12px 9px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 3px 12px -7px rgba(74,37,169,.35);cursor:pointer;transition:box-shadow .14s,border-color .14s,transform .14s}
  .fnode:hover{border-color:var(--coral);box-shadow:0 0 0 2.5px rgba(250,90,82,.35),0 10px 22px -12px rgba(74,37,169,.5);transform:translateY(-1px)}
  .fnode.sub{background:#F3EEFC;border-color:#C9B2F0;box-shadow:0 4px 14px -8px rgba(74,37,169,.55)}
  .fnode.sub:hover{border-color:var(--violet);box-shadow:0 0 0 2.5px rgba(74,37,169,.3),0 10px 22px -12px rgba(74,37,169,.6)}
  .fnode .fn-id{font-family:var(--mono);font-size:9.5px;color:#6B4FBF;background:#EFEAFB;padding:2px 7px;border-radius:5px;margin-bottom:6px;direction:ltr;letter-spacing:.01em}
  .fnode .fn-h{position:absolute;top:50%;width:6px;height:6px;border-radius:50%;background:#FA5A52;transform:translateY(-50%)}
  .fnode .fn-h.r{inset-inline-end:-3px}
  .fnode .fn-h.l{inset-inline-start:-3px}
  .fnode.sub .fn-id{background:#EAE0FA}
  .fnode .fn-t{font-weight:700;font-size:12px;line-height:1.55;color:var(--ink);overflow-wrap:anywhere;word-break:break-word}
  .fnode .fn-a{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:8px;padding-top:7px;border-top:1px solid #F4F0F8;width:100%}
  .fnode .fn-a .av{width:13px;height:13px;border-radius:50%;background:#F0E9FB;color:var(--violet);font-size:7px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
  .fnode .fn-a .nm{font-size:10px;color:var(--muted);overflow-wrap:anywhere}
  .fnode .fn-sub{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:7px;font-size:9px;color:var(--coral-ink);background:var(--c-soft);padding:2px 8px;border-radius:20px;font-weight:600}
  .fnode .fn-dots{position:absolute;top:4px;left:6px;display:flex;align-items:center;gap:2px;z-index:4}
  .fnode .fn-dots span{width:2.5px;height:2.5px;border-radius:50%;background:#c3bad6}
  /* floating controls */
  .fs-zoom{position:absolute;bottom:20px;inset-inline-end:20px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .fs-zoom .zb{width:34px;height:34px;border-radius:9px;border:1px solid var(--bd);background:#fff;color:#4A3F6B;font-size:18px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px -6px rgba(74,37,169,.4)}
  .fs-zoom .zb:hover{background:var(--v-softer);color:var(--violet)}
  .fs-key{position:absolute;bottom:20px;inset-inline-start:20px;display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:8px 14px;box-shadow:0 3px 12px -7px rgba(74,37,169,.4);z-index:5}
  .fs-key .k{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#4A3F6B;direction:ltr}
  .fs-key .k i{width:11px;height:11px;transform:rotate(45deg);border-radius:2px;display:block}
  .fs-zoomlabel{font-size:10.5px;color:var(--muted);font-family:var(--mono);text-align:center}
  .fterm{position:absolute;display:flex;align-items:center;justify-content:center;min-width:96px;height:46px;padding:0 20px;border-radius:24px;font-weight:700;font-size:13px;border:2px solid var(--violet);box-shadow:0 6px 16px -10px rgba(74,37,169,.5)}
  .fterm.start{background:var(--violet);color:#fff}
  .fterm.end{background:#fff;color:var(--violet)}
  .fjunc{position:absolute;width:46px;height:46px;cursor:default}
  .fjunc .sq{position:absolute;inset:8px;border-radius:6px;transform:rotate(45deg);box-shadow:0 6px 14px -8px rgba(0,0,0,.4)}
  .fjunc .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;color:#fff;pointer-events:none;letter-spacing:.02em}

  .fs-drawer{position:absolute;top:0;bottom:0;inset-inline-start:0;width:390px;max-width:92vw;background:#fff;border-inline-end:1px solid var(--bd);box-shadow:-20px 0 50px -30px rgba(74,37,169,.6);z-index:4;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  .fs-drawer.open{transform:translateX(0)}
  .dr-head{padding:20px 22px 16px;border-bottom:1px solid var(--hair)}
  .dr-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .dr-x{margin-inline-start:auto;width:30px;height:30px;border-radius:8px;border:none;background:var(--v-softer);color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
  .dr-x:hover{background:var(--c-soft);color:var(--coral-ink)}
  .dr-title{font-weight:800;font-size:16px;line-height:1.6;color:var(--ink)}
  .dr-body{flex:1;overflow:auto;padding:18px 22px 26px}
  .dr-actor{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--violet);background:var(--v-soft);border-radius:20px;padding:5px 12px;font-weight:600}
  .dr-sec{font-size:11px;font-weight:800;color:var(--muted);margin:20px 0 9px;letter-spacing:.03em}
  .dr-desc{font-size:13px;color:var(--body);line-height:2}
  .dr-enter{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:20px;padding:14px 16px;border:none;border-radius:14px;background:var(--violet);color:#fff;cursor:pointer;font-family:inherit;box-shadow:0 12px 26px -12px rgba(74,37,169,.7)}
  .dr-enter:hover{filter:brightness(1.08)}
  .dr-enter .e-t{font-weight:800;font-size:13.5px}.dr-enter .e-s{font-size:11px;opacity:.85;margin-top:2px}
  .dr-grp{margin-bottom:12px}
  .dr-grp .g-h{font-size:11px;font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .dr-grp.in .g-h{color:var(--in-fg)}.dr-grp.ctl .g-h{color:var(--ctl-fg)}.dr-grp.out .g-h{color:var(--out-fg)}.dr-grp.mech .g-h{color:var(--mech-fg)}

  @media(max-width:620px){.cover-sheet h1{font-size:32px}.sheet{padding:34px 22px}.fs-legend{display:none}}

  /* print-only static flowchart */
  .pf-wrap{display:none}
  /* measurement host: laid out (so node boxes get real sizes) but never painted,
     never printed, and never inside a display:none subtree */
  .pf-measure{position:absolute;left:-99999px;top:0;width:4000px;height:0;
    visibility:hidden;pointer-events:none;overflow:visible}
  /* each band is one page-sized slice of the diagram; bands never split across pages */
  .pf-band{margin:0 auto;width:max-content;max-width:100%}
  /* must clip to its viewBox — otherwise every band paints the whole diagram */
  .pf-band svg{display:block;overflow:hidden}
  .pf-band .fnode,.pf-band .fjunc,.pf-band .fterm{position:static!important;left:auto!important;top:auto!important}
  /* The print diagram deliberately inherits the on-screen node metrics: node
     positions are hand-placed as little as 50px apart, so any wider box would
     overlap its neighbour, and any taller box would close the row gaps that page
     breaks fall into. Legibility comes from drawing near 1:1, not from bigger type. */

  @media print{
    @page{margin:14mm 13mm;size:landscape}
    body{background:#fff}
    .topbar,.flowscreen{display:none!important}
    .doc{padding:0}
    .view.print-only{break-before:page}
    .view.print-only>.sheet{break-before:auto}
    .pf-measure{display:none!important}
    .sheet{box-shadow:none;border-radius:0;margin:0;max-width:none;padding:0;break-before:page}
    .sheet:first-child{break-before:auto}
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    .cover-sheet{min-height:auto;padding:0;break-before:auto}
    .cover-inner{padding:40px 10px}
    .divider-sheet{padding:60px 20px}
    .role,.kpi-role,.card,.kpi-card,.a0{break-inside:avoid}
    .flowbtn{display:none!important}
    .view,.view.print-only{display:block!important}
    .backbar{display:none!important}
    .pf-wrap{display:block!important;margin-top:14px}
    /* a band is an atomic <svg>: it is never fragmented, so no node can be halved
       or dropped. bands after the first start a fresh page. */
    .pf-band{break-inside:avoid}
    .pf-band+.pf-band{break-before:page}
    /* only used when the diagram's first unbreakable run is taller than the room
       left under the heading — rare, and it buys a much larger diagram */
    .pf-wrap.own-page{break-before:page}

    html,body{width:auto;overflow:visible}
    .doc,.layout,.sheet,.view{width:auto!important;max-width:100%!important;margin-inline:0!important}
    .a0{grid-template-columns:1fr minmax(200px,320px) 1fr;padding:16px 14px;gap:14px}
    .view.print-only .sheet-head h2{font-size:18px!important}
    .view.print-only .proc-meta{margin-top:8px!important}
    .view.print-only .proc-num-strip{margin-bottom:6px!important}
    .grid.g2,.grid.g3{grid-template-columns:1fr 1fr}
  }
</style>

<script>
const DATA = {"dept":{"code":"dining","name":"سالن","fullName":"دپارتمان سالن","description":"دپارتمان سالن مسئول تمام فرایندهای مرتبط با پذیرایی و خدمت‌رسانی به مشتری از لحظه ورود تا خروج است؛ از آماده‌سازی و نظافت سالن پیش از سرویس‌دهی گرفته تا راهنمایی مشتری برای ثبت سفارش در کیوسک، تحویل و معرفی غذا سر میز، رسیدگی به نیازها و شکایات مشتری، مدیریت زمان انتظار و بدرقه مشتری. کار این دپارتمان بر پایه فرهنگ سازمانی مجموعه شکل گرفته است که بر سر وقت بودن دقیق، بیشترین بازدهی با کمترین نیرو، کار تیمی و رویه‌های مکتوب و چک‌لیست‌محور تأکید دارد و رویکرد کلی مجموعه به سمت مدل فست‌فود و ساده‌سازی و خودخدمتی مشتری است.\n\nسالن به چند باکس (زون) تقسیم می‌شود که هر روز به‌صورت چرخشی بین پرسنل تقسیم می‌گردد تا هر فرد همه بخش‌ها را یاد بگیرد؛ در شعبه مرکزی بخش‌های شستشو، طی و حیاط/کانتر و در شعبه بالا (ناهارخوران) باکس‌های طبقه بالا، طبقه پایین و حیاط/تراس. نقش‌های سالن شامل سرپرست سالن (هدویتر/سرسالن‌دار) به عنوان مسئول نظارت و مدیریت، غذاآور/رانر (مهماندار) برای تحویل و کنترل و معرفی غذا، جونیور تفکیک (باسر) برای نظافت میزها و تفکیک پسماند، کیوسک‌من/راهنمای کیوسک برای خوشامدگویی و راهنمایی ثبت سفارش، و سرور تراس که هم‌زمان کار نظافت و غذابری یک بخش کامل را بر عهده دارد. ارتباط با آشپزخانه و صندوق طبق اصل وحدت فرماندهی و از طریق سرپرست سالن و غذاآور انجام می‌شود و همه اعضا به‌گونه‌ای آموزش دیده‌اند که در ساعات شلوغی به‌صورت سوئیچر از یکدیگر پشتیبانی کنند.","sub_units":[{"name":"بخش شستشو","description":"زیرمجموعه‌ای از سالن شعبه مرکزی که مسئول شستشوی بخش‌های سالن است و به‌همراه بخش طی به‌صورت تیمی و در یک محیط مشترک طبق اولویت و ترتیب تعیین‌شده کار می‌کند."},{"name":"بخش طی","description":"زیرمجموعه‌ای از سالن شعبه مرکزی که مسئول طی و تمیز کردن کف سالن است و در کنار بخش شستشو به‌صورت تیمی و طبق چک‌لیست و اولویت انجام‌وظیفه می‌کند."},{"name":"بخش حیاط و کانتر","description":"بخشی از سالن شعبه مرکزی شامل حیاط و کانتر که نظافت حیاط و بخش کانتر سالن را بر عهده دارد؛ کانتر محل تمیز کردن و نگهداری سینی‌ها و تفکیک پسماند است."},{"name":"باکس طبقه بالا","description":"یکی از باکس‌های // ---------- static flow for print ----------
// The print diagram is emitted as one or more <svg> "bands". An <svg> is an atomic
// box for the printer: Chrome will never drop its children the way it drops
// absolutely-positioned HTML that lands in an overflowing page fragment. Each band
// covers a horizontal slice of the diagram, and slices are only ever cut through
// empty gaps — so no node or edge label is ever split across a page.
// Page budget in CSS px for a landscape page, taken as the smaller of A4 and Letter
// so one build is correct on both. A4 landscape is 210mm ≈ 794px tall; subtract the
// 18mm top+bottom .doc padding (136px) and the 4mm top+bottom .sheet padding (30px)
// to get ≈627px of usable height. Width: Letter landscape 279.4mm ≈ 1056px, minus
// the 14mm side padding (106px) ≈ 950px. Both are kept a little under the true
// figure so a band never lands a hair over the page and gets pushed.
const PRINT={
  W:930,
  H:620,
  PAD:20,         // breathing room around the diagram
  HEADGAP:16,     // .pf-wrap margin-top in print, plus a little slack
  GAP:6,          // clearance kept above a cut
  MINSC:0.34      // never shrink below this; band instead
};

function printNodeMarkup(p){
  let ch='';
  p.nodes.forEach(n=>{
    if(n.type==='junction'){ const j=jsym(n.junctionType); ch+=`<div class="fjunc" data-id="${n.id}" style="left:${n.position.x}px;top:${n.position.y}px"><div class="sq" style="background:${j.c}"></div><div class="t">${esc(n.junctionType||'')}</div></div>`; }
    else if(n.type==='start'||n.type==='end'){ ch+=`<div class="fterm ${n.type}" data-id="${n.id}" style="left:${n.position.x}px;top:${n.position.y}px">${esc(n.label||(n.type==='start'?'شروع':'پایان'))}</div>`; }
    else { const hasSub=n.subprocess&&PMAP[n.subprocess];
      ch+=`<div class="fnode ${hasSub?'sub':''}" data-id="${n.id}" style="left:${n.position.x}px;top:${n.position.y}px">`
        +`<span class="fn-id" dir="ltr">${esc(n.id.replace(p.id+'-',''))}</span>`
        +`<div class="fn-t">${esc(n.label)}</div>`
        +(n.actor?`<div class="fn-a"><span class="av">۰</span><span class="nm">${esc(n.actor)}</span></div>`:'')
        +(hasSub?`<div class="fn-sub">${svg('<path d="M9 18l6-6-6-6"/>',10,2.4)}زیرفرآیند</div>`:'')
        +`</div>`; }
  });
  return ch;
}

// Every y where nothing is painted — the only places a page break may fall.
// blocks is a list of [top,bottom] for node boxes and edge labels.
function freeCuts(blocks,top,bottom){
  const sorted=blocks.slice().sort((a,b)=>a[0]-b[0]);
  const cuts=[]; let cover=top;
  sorted.forEach(b=>{
    if(b[0]>cover+2*PRINT.GAP) cuts.push([cover+PRINT.GAP,b[0]-PRINT.GAP]);
    cover=Math.max(cover,b[1]);
  });
  if(bottom>cover+2*PRINT.GAP) cuts.push([cover+PRINT.GAP,bottom-PRINT.GAP]);
  return cuts;
}

// Tallest run of diagram that has no legal break inside it. No scale can put more
// than this on one page, so it sets the upper bound on how large we may draw.
function maxChunk(top,bottom,cuts){
  if(!cuts.length) return bottom-top;
  let m=cuts[0][1]-top;
  for(let i=0;i<cuts.length-1;i++) m=Math.max(m,cuts[i+1][1]-cuts[i][0]);
  return Math.max(m,bottom-cuts[cuts.length-1][0]);
}

// Slice [top,bottom] into bands no taller than that band's budget, breaking only
// inside a free gap so no node or label is ever cut in half. Returns null when a
// band cannot be closed — the caller then scales down and retries.
function bandSplit(top,bottom,cuts,budgetFor){
  const bands=[]; let start=top; let guard=0;
  while(start<bottom-0.5 && guard++<200){
    const limit=start+budgetFor(bands.length);
    if(limit>=bottom-0.5){ bands.push([start,bottom]); return bands; }
    // lowest legal break at or above the limit
    let cut=-1;
    for(const [a,b] of cuts){ if(a>limit) break; if(b>start+20) cut=Math.max(cut,Math.min(b,limit)); }
    if(cut<=start+20) return null;
    bands.push([start,cut]); start=cut;
  }
  return bands.length?bands:[[top,bottom]];
}

function buildPrintFlows(){
  const measure=document.getElementById('pfMeasure');
  if(!measure) return;
  DATA.processes.forEach(p=>{
    const uid=p.id.replace(/[^a-z0-9]/gi,'');
    const wrap=document.getElementById('pf-'+uid); if(!wrap) return;

    // 1) lay the real nodes out in the offscreen host so every box is measured,
    //    not estimated. This host is never display:none, so sizes are always real.
    measure.innerHTML=printNodeMarkup(p);
    const g=edgeGeometry(p,measure);
    const b=geomBounds(g);
    if(!isFinite(b.minX)||!isFinite(b.maxY)){ wrap.innerHTML=''; return; }

    const minX=b.minX-PRINT.PAD, minY=b.minY-PRINT.PAD;
    const W=(b.maxX+PRINT.PAD)-minX, H=(b.maxY+PRINT.PAD)-minY;

    // 2) how much vertical room is left on the page that carries the heading?
    const headH=measureHeadingHeight(wrap);
    const firstH=Math.max(220,PRINT.H-headH);

    // 3) Prefer the whole diagram on the heading page when that costs little size.
    //    Otherwise keep it at full page width and break it across pages instead —
    //    a readable diagram over two pages beats a complete but tiny one.
    const blocks=Object.values(g.rect).map(r=>[r.y,r.y+r.h])
      .concat(g.segs.filter(s=>s.label).map(s=>[s.label.y,s.label.y+s.label.h]));
    const cuts=freeCuts(blocks,minY,minY+H);
    const scW=Math.min(1,PRINT.W/W);
    const scOne=Math.min(scW,firstH/H);
    let sc,bands,ownPage=false;
    if(scOne>=scW*0.8){
      sc=scOne; bands=[[minY,minY+H]];            // fits under the heading, near full size
    }else{
      sc=Math.max(PRINT.MINSC,Math.min(scW,PRINT.H/maxChunk(minY,minY+H,cuts)));
      bands=bandSplit(minY,minY+H,cuts,(k)=>(k===0?firstH:PRINT.H)/sc);
      if(!bands){                                  // first chunk is taller than the
        ownPage=true;                              // heading page allows — give the
        bands=bandSplit(minY,minY+H,cuts,()=>PRINT.H/sc);   // diagram a fresh page
      }
      if(!bands){ ownPage=false; sc=Math.min(scW,firstH/H); bands=[[minY,minY+H]]; }
    }
    wrap.classList.toggle('own-page',ownPage);

    // 4) emit one atomic <svg> per band
    wrap.innerHTML=bands.map(([y0,y1],bi)=>{
      const bh=y1-y0, mk=`pfah-${uid}-${bi}`;
      let fo='';
      measure.querySelectorAll('[data-id]').forEach(el=>{
        const id=el.getAttribute('data-id'), r=g.rect[id];
        if(!r||r.y>=y1||r.y+r.h<=y0) return;       // outside this band
        fo+=`<foreignObject x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" style="overflow:visible">`
          +`<div xmlns="http://www.w3.org/1999/xhtml" style="width:${r.w}px;height:${r.h}px">${el.outerHTML}</div>`
          +`</foreignObject>`;
      });
      // an edge is drawn whenever either end is on this band; the viewBox clips the rest
      const segs=g.segs.filter(s=>{
        const ya=Math.min(s.a.y,s.b.y), yb=Math.max(s.a.y,s.b.y);
        return yb>=y0 && ya<=y1;
      });
      return `<div class="pf-band"><svg xmlns="http://www.w3.org/2000/svg" viewBox="${minX} ${y0} ${W} ${bh}" width="${Math.round(W*sc)}" height="${Math.round(bh*sc)}">`
        +`<defs><marker id="${mk}" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#A99AD0"/></marker></defs>`
        +edgeMarkup(segs,mk)+fo+`</svg></div>`;
    }).join('');
    wrap.dataset.bands=bands.length; wrap.dataset.scale=sc.toFixed(3);
  });
  measure.innerHTML='';
}

// Height of the title + id + meta block above the diagram, measured at print width.
function measureHeadingHeight(wrap){
  const sheet=wrap.closest('.sheet'), view=wrap.closest('.view');
  const head=sheet&&sheet.querySelector('.sheet-head'), meta=sheet&&sheet.querySelector('.proc-meta');
  if(!head||!meta) return 130;
  const prev=view?view.getAttribute('style'):null;
  if(view) view.setAttribute('style','display:block!important;position:absolute;visibility:hidden;left:-99999px;top:0;width:'+PRINT.W+'px');
  const h=Math.ceil(meta.getBoundingClientRect().bottom-head.getBoundingClientRect().top);
  if(view){ if(prev) view.setAttribute('style',prev); else view.removeAttribute('style'); }
  return (isFinite(h)&&h>0)?h+PRINT.HEADGAP:130;
}

// ---------- flow screen ----------
let navStack=[]; let zoom=1, panX=0, panY=0;
const stage=document.getElementById('fsStage'), canvas=document.getElementById('fsCanvas'), screenEl=document.getElementById('flowScreen'), drawer=document.getElementById('fsDrawer');
document.getElementById('fsLegend').innerHTML=['OR','AND','XOR'].map(t=>{const j=jsym(t);return `<span class="k" title="${j.t}">${t}<i style="background:${j.c}"></i></span>`;}).join('');

function openFlow(id){ if(!PMAP[id])return; navStack=[id]; screenEl.hidden=false; document.body.style.overflow='hidden'; showHint(); buildScreen(); }
function enterSub(id){ if(!PMAP[id])return; navStack.push(id); closeDrawer(); buildScreen(); }
function crumbTo(i){ navStack=navStack.slice(0,i+1); closeDrawer(); buildScreen(); }
function backFlow(){ if(navStack.length>1){ navStack.pop(); closeDrawer(); buildScreen(); } else closeFlow(); }
function closeFlow(){ screenEl.hidden=true; document.body.style.overflow=''; closeDrawer(); }
let hintT; function showHint(){ const el=document.getElementById('fsHint'); el.style.opacity='1'; clearTimeout(hintT); hintT=setTimeout(()=>el.style.opacity='0',3400); }
function curProc(){ return PMAP[navStack[navStack.length-1]]; }

function buildScreen(){
  const p=curProc();
  const rootIdx=DATA.processes.findIndex(x=>x.id===navStack[0]);
  const prevB=document.getElementById('fsPrev'), nextB=document.getElementById('fsNext');
  prevB.disabled=!(rootIdx>0); nextB.disabled=!(rootIdx>=0&&rootIdx<DATA.processes.length-1);
  prevB.title=rootIdx>0?('فرآیند قبلی: '+DATA.processes[rootIdx-1].name):'فرآیند قبلی';
  nextB.title=(rootIdx>=0&&rootIdx<DATA.processes.length-1)?('فرآیند بعدی: '+DATA.processes[rootIdx+1].name):'فرآیند بعدی';
  document.getElementById('fsCrumbs').innerHTML=navStack.map((id,i)=>{ const nm=PMAP[id].name, cur=i===navStack.length-1; return `${i>0?'<span class="sep">‹</span>':''}<span class="cr ${cur?'cur':''}" ${cur?'':`onclick="crumbTo(${i})"`}>${esc(nm)}</span>${cur?`<span class="pid">${esc(id)}</span>`:''}`; }).join('');
  const nodes=p.nodes; let maxX=0,maxY=0;
  nodes.forEach(n=>{ const w=n.type==='junction'?46:(n.type==='activity'?230:120), hh=n.type==='junction'?46:(n.type==='activity'?150:46); maxX=Math.max(maxX,n.position.x+w); maxY=Math.max(maxY,n.position.y+hh); });
  const W=maxX+80, H=maxY+60;
  let ch=`<svg class="fedges" id="fsEdges" width="${W}" height="${H}"><defs><marker id="fsah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#A99AD0"/></marker></defs></svg>`;
  nodes.forEach(n=>{
    if(n.type==='junction'){
      const j=jsym(n.junctionType);
      ch+=`<div class="fjunc" data-id="${n.id}" title="${j.t}" style="left:${n.position.x}px;top:${n.position.y}px"><div class="sq" style="background:${j.c}"></div><div class="t">${esc(n.junctionType||'')}</div></div>`;
    } else if(n.type==='start'||n.type==='end'){
      ch+=`<div class="fterm ${n.type}" data-id="${n.id}" style="left:${n.position.x}px;top:${n.position.y}px">${esc(n.label||(n.type==='start'?'شروع':'پایان'))}</div>`;
    } else {
      const hasSub=n.subprocess&&PMAP[n.subprocess];
      ch+=`<div class="fnode ${hasSub?'sub':''}" data-id="${n.id}" style="left:${n.position.x}px;top:${n.position.y}px">`
        +`<div class="fn-dots"><span></span><span></span><span></span></div>`
        +`<span class="fn-id" dir="ltr">${esc(n.id.replace(p.id+'-',''))}</span>`
        +`<div class="fn-t">${esc(n.label)}</div>`
        +(n.actor?`<div class="fn-a"><span class="av">۰</span><span class="nm">${esc(n.actor)}</span></div>`:'')
        +(hasSub?`<div class="fn-sub">${svg('<path d="M9 18l6-6-6-6"/>',10,2.4)}زیرفرآیند — برای ورود کلیک کنید</div>`:'')
        +`<span class="fn-h r"></span><span class="fn-h l"></span>`
        +`</div>`;
    }
  });
  canvas.style.width=W+'px'; canvas.style.height=H+'px'; canvas.innerHTML=ch;
  const paint=()=>{ try{ drawEdges(p); fit(); }catch(e){} };
  setTimeout(paint,0);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(curProc()===p) paint(); });
}
// Geometry only — reads the laid-out node boxes and returns edge curves plus label
// boxes in the diagram's own coordinate space. Shared by the screen canvas and the
// print diagrams so both always agree on where an edge starts and ends.
function edgeGeometry(p,canvasEl){
  const rect={};
  canvasEl.querySelectorAll('[data-id]').forEach(el=>{ rect[el.getAttribute('data-id')]={x:el.offsetLeft,y:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight}; });
  const border=(r,tx,ty)=>{ const cx=r.x+r.w/2,cy=r.y+r.h/2; let dx=tx-cx,dy=ty-cy; if(!dx&&!dy)return{x:cx,y:cy}; const sx=dx?(r.w/2)/Math.abs(dx):1e9, sy=dy?(r.h/2)/Math.abs(dy):1e9, s=Math.min(sx,sy); return {x:cx+dx*s,y:cy+dy*s}; };
  const segs=[];
  (p.edges||[]).forEach(e=>{
    const rs=rect[e.from], rt=rect[e.to]; if(!rs||!rt)return;
    const cs={x:rs.x+rs.w/2,y:rs.y+rs.h/2}, ct={x:rt.x+rt.w/2,y:rt.y+rt.h/2};
    const a=border(rs,ct.x,ct.y), b=border(rt,cs.x,cs.y);
    let c1,c2; if(Math.abs(b.x-a.x)>=Math.abs(b.y-a.y)){const mx=(a.x+b.x)/2;c1=`${mx} ${a.y}`;c2=`${mx} ${b.y}`;}else{const my=(a.y+b.y)/2;c1=`${a.x} ${my}`;c2=`${b.x} ${my}`;}
    const seg={d:`M${a.x} ${a.y} C ${c1}, ${c2}, ${b.x} ${b.y}`,a,b};
    if(e.label){ const lx=(a.x+b.x)/2, ly=(a.y+b.y)/2, w=Math.min(240,e.label.length*7.2+16);
      seg.label={x:lx-w/2,y:ly-22,w:w,h:34,text:e.label}; }
    segs.push(seg);
  });
  return {rect,segs};
}
function edgeMarkup(segs,markerId,labelSize){
  const fs=labelSize||10;
  return segs.map(s=>{
    let out=`<path d="${s.d}" fill="none" stroke="#A99AD0" stroke-width="1.4" marker-end="url(#${markerId})"/>`;
    if(s.label){ const l=s.label;
      out+=`<foreignObject x="${l.x}" y="${l.y}" width="${l.w}" height="${l.h}"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:${fs}px;font-weight:600;color:#7A5FC8;text-align:center;line-height:1.4;font-family:'Vazirmatn',sans-serif;background:rgba(255,255,255,.82);border-radius:6px;padding:2px 6px;display:inline-block">${esc(l.text)}</div></foreignObject>`; }
    return out;
  }).join('');
}
function geomBounds(g){
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  Object.values(g.rect).forEach(r=>{ minX=Math.min(minX,r.x); minY=Math.min(minY,r.y); maxX=Math.max(maxX,r.x+r.w); maxY=Math.max(maxY,r.y+r.h); });
  g.segs.forEach(s=>{ if(!s.label)return; const l=s.label; minX=Math.min(minX,l.x); minY=Math.min(minY,l.y); maxX=Math.max(maxX,l.x+l.w); maxY=Math.max(maxY,l.y+l.h); });
  return {minX,minY,maxX,maxY};
}
function drawEdges(p,canvasEl,svgEl,shiftX,shiftY,markerId){
  markerId=markerId||"fsah";
  canvasEl=canvasEl||canvas; svgEl=svgEl||document.getElementById('fsEdges');
  // clear anything drawn before (keep <defs>) so repeat calls don't duplicate edges
  [...svgEl.childNodes].forEach(n=>{ if(n.nodeName.toLowerCase()!=='defs') svgEl.removeChild(n); });
  shiftX=shiftX||0; shiftY=shiftY||0;
  const g=edgeGeometry(p,canvasEl);
  const html=edgeMarkup(g.segs,markerId);
  svgEl.insertAdjacentHTML('beforeend',shiftX||shiftY?`<g transform="translate(${shiftX},${shiftY})">${html}</g>`:html);
  return geomBounds(g);
}
function applyTransform(){ canvas.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`; document.getElementById('fsZoom').textContent=Math.round(zoom*100)+'٪'; }
function fit(){ const cw=canvas.offsetWidth, chh=canvas.offsetHeight, sw=stage.clientWidth, sh=stage.clientHeight; zoom=Math.min(1,Math.max(.25,Math.min((sw-60)/cw,(sh-60)/chh))); panX=-Math.max(0,(sw-cw*zoom)/2); panY=Math.max(20,(sh-chh*zoom)/2); applyTransform(); }
function zoomBy(dz,ax,ay){ const z=Math.max(.25,Math.min(2,zoom+dz)); if(z===zoom)return;
  const S=(ax==null?stage.clientWidth/2:(stage.getBoundingClientRect().right-ax));
  const Sy=(ay==null?stage.clientHeight/2:(ay-stage.getBoundingClientRect().top));
  const d=(S+panX)/zoom, dy=(Sy-panY)/zoom;
  panX=d*z-S; panY=Sy-dy*z; zoom=z; applyTransform(); }

let dragging=false, moved=false, sx=0, sy=0, spx=0, spy=0, downNode=null, downOnChrome=false;
stage.addEventListener('pointerdown',(e)=>{ if(e.target.closest('.fs-drawer'))return; const nd=e.target.closest('.fnode'); downNode=nd?nd.getAttribute('data-id'):null; downOnChrome=!!(e.target.closest('.fjunc')||e.target.closest('.fterm')); dragging=true; moved=false; sx=e.clientX; sy=e.clientY; spx=panX; spy=panY; stage.classList.add('grabbing'); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove',(e)=>{ if(!dragging)return; const dx=e.clientX-sx, dy=e.clientY-sy; if(Math.abs(dx)+Math.abs(dy)>4)moved=true; panX=spx+dx; panY=spy+dy; applyTransform(); });
stage.addEventListener('pointerup',(e)=>{ dragging=false; stage.classList.remove('grabbing'); if(moved){ downNode=null; return; } if(downNode){ onNodeClick(downNode); } else if(!downOnChrome){ closeDrawer(); } downNode=null; });
stage.addEventListener('wheel',(e)=>{ e.preventDefault(); zoomBy(e.deltaY>0?-.09:.09, e.clientX, e.clientY); },{passive:false});

function onNodeClick(nid){ const p=curProc(); const n=p.nodes.find(x=>x.id===nid); if(!n)return; if(n.subprocess&&PMAP[n.subprocess]){ enterSub(n.subprocess); return; } openDrawer(n); }
function grp(icom,k,cls,t){ const arr=icom[k]||[]; if(!arr.length)return''; return `<div class="dr-grp ${cls}"><div class="g-h">${t} <span style="opacity:.6">(${toFa(arr.length)})</span></div><div class="chips">`+arr.map(x=>`<span class="chip">${esc(x)}</span>`).join('')+`</div></div>`; }
function openDrawer(n){
  const hasSub=n.subprocess&&PMAP[n.subprocess]; const ic=n.icom||{};
  const icHtml=grp(ic,'inputs','in','ورودی‌ها')+grp(ic,'controls','ctl','کنترل‌ها')+grp(ic,'outputs','out','خروجی‌ها')+grp(ic,'mechanisms','mech','مکانیزم‌ها');
  drawer.innerHTML=`<div class="dr-head"><div class="dr-top"><button class="dr-x" onclick="closeDrawer()">✕</button></div><div class="dr-title">${esc(n.label)}</div></div>
  <div class="dr-body">
    ${n.actor?`<div class="dr-sec">مسئول انجام</div><div><span class="dr-actor">${iconActor}${esc(n.actor)}</span></div>`:''}
    ${n.description?`<div class="dr-sec">شرح فعالیت</div><div class="dr-desc">${esc(n.description)}</div>`:''}
  </div>`;
  drawer.classList.add('open');
}
function closeDrawer(){ drawer.classList.remove('open'); }

function stepProc(d){ const i=DATA.processes.findIndex(x=>x.id===navStack[0]); const j=i+d; if(i<0||j<0||j>=DATA.processes.length)return; navStack=[DATA.processes[j].id]; closeDrawer(); buildScreen(); }
document.getElementById('fsPrev').addEventListener('click',()=>stepProc(-1));
document.getElementById('fsNext').addEventListener('click',()=>stepProc(1));
document.getElementById('fsBack').addEventListener('click',backFlow);
document.getElementById('fsClose').addEventListener('click',closeFlow);
document.getElementById('fsZoomIn').addEventListener('click',()=>zoomBy(.15));
document.getElementById('fsZoomOut').addEventListener('click',()=>zoomBy(-.15));
document.getElementById('fsFit').addEventListener('click',fit);
document.addEventListener('keydown',(e)=>{ if(screenEl.hidden)return; if(e.key==='Escape'){ if(drawer.classList.contains('open'))closeDrawer(); else backFlow(); } });

render();
function showView(v){
  const cur=document.querySelector('.view.active');
  if(cur) SCROLLPOS[cur.id]=window.scrollY;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('view-'+v)||document.getElementById('view-home');
  el.classList.add('active');
  document.getElementById('homeBtn').style.display=(v==='home')?'none':'';
  const y=SCROLLPOS[el.id]||0;
  requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'auto'}));
}
const SCROLLPOS={};
showView('home');
// every activity/junction of every process must be present in some band
const pfOK=()=>DATA.processes.every(p=>{
  const wrap=document.getElementById('pf-'+p.id.replace(/[^a-z0-9]/gi,''));
  if(!wrap||!wrap.querySelector('svg')) return false;
  const have=new Set([...wrap.querySelectorAll('[data-id]')].map(el=>el.getAttribute('data-id')));
  return p.nodes.every(n=>have.has(n.id));
});
const buildPF=()=>{ try{ buildPrintFlows(); }catch(e){ console.warn('printflow build failed',e); } };
const buildPFSure=(tries)=>{ buildPF(); if(!pfOK()&&(tries||0)<4) setTimeout(()=>buildPFSure((tries||0)+1),350); };
setTimeout(()=>buildPFSure(0),0);
// Persian glyph metrics decide how node text wraps, so re-measure once the webfont lands
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>buildPFSure(0));
window.addEventListener('load',()=>buildPFSure(0));
window.addEventListener('beforeprint',()=>{ buildPF(); if(!pfOK()) buildPF(); });
</script>
