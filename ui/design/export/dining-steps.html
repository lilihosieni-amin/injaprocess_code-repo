<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="omelette-owns-print" content="1">
<title>راهنمای گام‌به‌گام کار — واحد سالن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#4A25A9; --ink:#2A1D5E; --deep:#2E1668; --coral:#FA5A52; --coral-ink:#E23D35;
    --app:#FBF7F1; --card:#fff; --v-soft:#F0E9FB; --v-softer:#F5F1FB; --c-soft:#FFE9E7;
    --bd:#EFE7DC; --bd-v:#E3D8F5; --hair:#F2ECE3;
    --muted:#8a7db0; --faint:#a99fc4; --body:#4A3F6B;
    --ok:#1F8A5B; --ok-s:#E4F6EC; --warn:#B4690E; --warn-s:#FBEEDC;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:'Vazirmatn',system-ui,sans-serif;background:var(--app);color:var(--ink);line-height:1.9;font-size:17px}
  ::selection{background:var(--coral);color:#fff}
  button{font-family:inherit}

  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--deep);color:#fff}
  .topbar img{width:34px;height:34px;border-radius:9px;object-fit:cover}
  .topbar .tt{font-weight:800;font-size:16px}
  .topbar .sp{flex:1}
  .tbtn{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;border-radius:11px;padding:9px 15px;cursor:pointer;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff}
  .tbtn:hover{background:rgba(255,255,255,.22)}

  .wrap{max-width:860px;margin:0 auto;padding:26px 20px 90px}
  .view{display:none}
  .view.active{display:block}

  /* ---- home ---- */
  .home-head{text-align:center;padding:18px 0 26px}
  .home-head h1{font-size:32px;font-weight:800;margin:0 0 10px}
  .home-head p{font-size:17px;color:var(--muted);margin:0}
  .plist{display:flex;flex-direction:column;gap:12px}
  .pbtn{display:flex;align-items:center;gap:16px;width:100%;text-align:right;background:#fff;border:2px solid var(--bd);border-radius:18px;padding:18px 20px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .pbtn:hover{border-color:var(--violet);box-shadow:0 12px 28px -16px rgba(74,37,169,.5)}
  .pbtn .pn{width:46px;height:46px;flex:none;border-radius:14px;background:var(--v-soft);color:var(--violet);display:flex;align-items:center;justify-content:center}
  .pbtn .pn.sub{background:var(--warn-s);color:var(--warn)}
  .ptag{display:inline-block;font-size:12.5px;font-weight:700;border-radius:20px;padding:2px 10px;margin-inline-start:9px;vertical-align:middle;color:var(--violet);background:var(--v-soft)}
  .ptag.sub{color:var(--warn);background:var(--warn-s)}
  .pbtn .pt{flex:1;min-width:0;font-weight:700;font-size:19px;line-height:1.7}
  .pbtn .pc{font-size:14px;color:var(--muted);font-weight:600;flex:none}
  .pbtn .pg{color:var(--violet);flex:none;display:flex}

  /* ---- step page ---- */
  .backbtn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;border-radius:12px;padding:10px 16px;cursor:pointer;border:2px solid var(--bd-v);background:#fff;color:var(--violet);margin-bottom:18px}
  .backbtn:hover{background:var(--v-softer)}
  .crumbs{font-size:14px;color:var(--muted);margin-bottom:12px;line-height:2}
  .crumbs b{color:var(--ink)}
  .crumbs span.sep{opacity:.5;margin:0 5px}
  .page-title{font-size:27px;font-weight:800;margin:0 0 12px;line-height:1.6}
  .page-sum{background:#fff;border:2px solid var(--bd);border-radius:16px;padding:18px 20px;font-size:16px;color:var(--body);line-height:2.1;margin-bottom:8px}
  .page-sum .sl{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:8px}
  .howto{display:flex;align-items:center;gap:10px;background:var(--v-softer);border-radius:14px;padding:12px 16px;font-size:14.5px;color:var(--body);margin:16px 0 22px}
  .howto svg{color:var(--violet);flex:none}

  .steps{display:flex;flex-direction:column;gap:10px}
  .step{background:#fff;border:2px solid var(--bd);border-radius:16px;overflow:hidden}
  .step.open{border-color:var(--violet)}
  .step.has-sub{background:#FDF3E4;border-color:#EBD3A8}
  .step.has-sub .step-row:hover{background:#FBE9CF}
  .step.has-sub .sn{background:var(--warn)}
  .step-row{display:flex;align-items:flex-start;gap:15px;width:100%;text-align:right;background:none;border:none;padding:16px 18px;cursor:pointer}
  .step-row:hover{background:var(--v-softer)}
  .sn{width:42px;height:42px;flex:none;border-radius:12px;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;margin-top:1px}
  .st{flex:1;min-width:0}
  .st .label{font-weight:700;font-size:18px;line-height:1.8;color:var(--ink)}
  .badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .bdg{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:700;border-radius:20px;padding:4px 12px}
  .bdg.cond{color:var(--warn);background:var(--warn-s)}
  .bdg.back{color:var(--coral-ink);background:var(--c-soft);cursor:pointer;border:1.5px solid transparent}
  .bdg.back:hover{border-color:var(--coral);background:#FFD9D5}
  .step.flash{border-color:var(--coral);box-shadow:0 0 0 4px rgba(250,90,82,.22)}
  .bdg.sub{color:#fff;background:var(--violet)}
  .chev{flex:none;color:var(--violet);display:flex;margin-top:9px;transition:transform .18s}
  .step.open .chev{transform:rotate(-90deg)}
  .step-body{display:none;padding:0 18px 18px 18px;border-top:2px dashed var(--hair);margin:0 18px 0;padding-top:15px}
  .step.open .step-body{display:block}
  .fld{margin-bottom:14px}
  .fld:last-child{margin-bottom:0}
  .fld .k{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:5px}
  .fld .v{font-size:16px;color:var(--body);line-height:2.1}
  .actor{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--violet);background:var(--v-soft);border-radius:12px;padding:8px 14px}

  /* branch group */
  .grp{border:2px solid #F5CFCB;border-radius:18px;background:#FFF4F3;padding:16px}
  .grp-h{display:flex;align-items:center;gap:11px;font-weight:800;font-size:17px;color:var(--coral-ink);margin-bottom:14px}
  .grp-h .gi{width:34px;height:34px;flex:none;border-radius:11px;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .branch{background:#fff;border:2px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
  .branch:last-child{margin-bottom:0}
  .branch-h{display:flex;align-items:flex-start;gap:9px;font-size:16px;font-weight:700;color:var(--ink);margin-bottom:12px;line-height:1.8}
  .branch-h .bl{width:26px;height:26px;flex:none;border-radius:8px;background:var(--warn-s);color:var(--warn);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-top:3px}
  .branch .steps{gap:8px}
  .branch .step{border-width:1.5px}
  .nothing{font-size:16px;color:var(--ok);background:var(--ok-s);border-radius:12px;padding:11px 15px;font-weight:700}

  .endmark{display:flex;align-items:center;gap:13px;background:var(--ok-s);border:2px solid #C4E7D3;border-radius:16px;padding:16px 18px;font-size:18px;font-weight:800;color:var(--ok);margin-top:14px}
  .endmark .ei{width:38px;height:38px;flex:none;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center}

  #printdoc{display:none}
  @media print{
    @page{margin:14mm 13mm;size:portrait}
    html,body{background:#fff;font-size:12.5pt}
    .topbar,#app{display:none!important}
    #printdoc{display:block;padding:0}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
    .psec{break-before:page}
    .pindex ol.plist-print{list-style:none;margin:6px 0 0;padding:0}
    .pindex ol.plist-print li{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--hair);padding:9px 2px}
    .pindex ol.plist-print li.sub{padding-inline-start:18px}
    .pindex .il{flex:1;font-size:11.5pt;font-weight:700;color:var(--ink);line-height:1.7}
    .pindex .it{flex:none;font-size:9pt;font-weight:700;border-radius:20px;padding:2px 9px;color:var(--violet);background:var(--v-soft)}
    .pindex .it.sub{color:var(--warn);background:var(--warn-s)}
    .pindex .ic{flex:none;font-size:9.5pt;color:var(--muted);font-weight:600}
    .psec:first-child{break-before:auto}
    .psec>h2{font-size:19pt;font-weight:800;margin:0 0 10px;line-height:1.6;color:var(--ink)}
    .psec .ptype{display:inline-block;font-size:9.5pt;font-weight:700;border-radius:20px;padding:2px 10px;margin-bottom:12px;color:var(--violet);background:var(--v-soft)}
    .psec .ptype.sub{color:var(--warn);background:var(--warn-s)}
    .psec .psum{border:1.5px solid var(--bd);border-radius:10px;padding:10px 13px;font-size:10.5pt;color:var(--body);line-height:1.9;margin-bottom:14px}
    .psec .psum b{display:block;font-size:9pt;color:var(--muted);margin-bottom:4px}
    .pstep{display:flex;gap:10px;border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:7px;break-inside:avoid}
    .pstep.sub{background:#FDF3E4;border-color:#EBD3A8}
    .pstep .n{width:26px;height:26px;flex:none;border-radius:8px;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10pt}
    .pstep.sub .n{background:var(--warn)}
    .pstep .c{flex:1;min-width:0}
    .pstep .l{font-weight:700;font-size:11.5pt;line-height:1.7;color:var(--ink)}
    .pstep .m{font-size:9.5pt;color:var(--violet);font-weight:700;margin-top:4px}
    .pstep .d{font-size:10pt;color:var(--body);line-height:1.85;margin-top:5px}
    .pstep .tags{margin-top:5px;display:flex;flex-wrap:wrap;gap:5px}
    .pstep .tg{font-size:9pt;font-weight:700;border-radius:20px;padding:2px 9px}
    .tg.cond{color:var(--warn);background:var(--warn-s)}
    .tg.back{color:var(--coral-ink);background:var(--c-soft)}
    .tg.sub{color:#fff;background:var(--warn)}
    .pgrp{border:1.5px solid #F5CFCB;background:#FFF4F3;border-radius:12px;padding:11px;margin-bottom:7px}
    .pgrp>.h{font-weight:800;font-size:11pt;color:var(--coral-ink);margin-bottom:9px}
    .pbr{border:1.5px solid var(--bd);background:#fff;border-radius:10px;padding:9px;margin-bottom:6px;break-inside:avoid}
    .pbr:last-child{margin-bottom:0}
    .pbr>.h{font-weight:700;font-size:10.5pt;color:var(--ink);margin-bottom:7px;line-height:1.7}
    .pnone{font-size:10pt;font-weight:700;color:var(--ok);background:var(--ok-s);border-radius:8px;padding:7px 11px}
    .pend{font-size:11pt;font-weight:800;color:var(--ok);background:var(--ok-s);border:1.5px solid #C4E7D3;border-radius:10px;padding:9px 13px;margin-top:10px;break-inside:avoid}
  }
  @media(max-width:560px){
    body{font-size:16px}
    .wrap{padding:18px 14px 70px}
    .home-head h1{font-size:26px}
    .page-title{font-size:22px}
    .st .label{font-size:17px}
  }
</style>
</head>
<body>
<div class="topbar">
  <img src="../assets/inja-logo.jpg" alt="">
  <div class="tt">راهنمای گام‌به‌گام کار</div>
  <div class="sp"></div>
  <button class="tbtn" onclick="goHome()">فهرست کارها</button>
  <button class="tbtn" onclick="window.print()">چاپ</button>
</div>
<div class="wrap" id="app"></div>
<div id="printdoc"></div>

<script>
const DATA = {"dept":{"code":"dining","name":"سالن","fullName":"دپارتمان سالن","description":"دپارتمان سالن مسئول تمام فرایندهای مرتبط با پذیرایی و خدمت‌رسانی به مشتری از لحظه ورود تا خروج است؛ از آماده‌سازی و نظافت سالن پیش از سرویس‌دهی گرفته تا راهنمایی مشتری برای ثبت سفارش در کیوسک، تحویل و معرفی غذا سر میز، رسیدگی به نیازها و شکایات مشتری، مدیریت زمان انتظار و بدرقه مشتری. کار این دپارتمان بر پایه فرهنگ سازمانی مجموعه شکل گرفته است که بر سر وقت بودن دقیق، بیشترین بازدهی با کمترین نیرو، کار تیمی و رویه‌های مکتوب و چک‌لیست‌محور تأکید دارد و رویکرد کلی مجموعه به سمت مدل فست‌فود و ساده‌سازی و خودخدمتی مشتری است.\n\nسالن به چند باکس (زون) تقسیم می‌شود که هر روز به‌صورت چرخشی بین پرسنل تقسیم می‌گردد تا هر فرد همه بخش‌ها را یاد بگیرد؛ در شعبه مرکزی بخش‌های شستشو، طی و حیاط/کانتر و در شعبه بالا (ناهارخوران) باکس‌های طبقه بالا، طبقه پایین و حیاط/تراس. نقش‌های سالن شامل سرپرست سالن (هدویتر/سرسالن‌دار) به عنوان مسئول نظارت و مدیریت، غذاآور/رانر (مهماندار) برای تحویل و کنترل و معرفی غذا، جونیور تفکیک (باسر) برای نظافت میزها و تفکیک پسماند، کیوسک‌من/راهنمای کیوسک برای خوشامدگویی و راهنمایی ثبت سفارش، و سرور تراس که هم‌زمان کار نظافت و غذابری یک بخش کامل را بر عهده دارد. ارتباط با آشپزخانه و صندوق طبق اصل وحدت فرماندهی و از طریق سرپرست سالن و غذاآور انجام می‌شود و همه اعضا به‌گونه‌ای آموزش دیده‌اند که در ساعات شلوغی به‌صورت سوئیچر از یکدیگر پشتیبانی کنند.","sub_units":[{"name":"بخش شستشو","description":"زیرمجموعه‌ای از سالن شعبه مرکزی که مسئول شستشوی بخش‌های سالن است و به‌همراه بخش طی به‌صورت تیمی و در یک محیط مشترک طبق اولویت و ترتیب تعیین‌شده کار می‌کند."},{"name":"بخش طی","description":"زیرمجموعه‌ای از سالن شعبه مرکزی که مسئول طی و تمیز کردن کف سالن است و در کنار بخش شستشو به‌صورت تیمی و طبق چک‌لیست و اولویت انجام‌وظیفه می‌کند."},{"name":"بخش حیاط و کانتر","description":"بخشی از سالن شعبه مرکزی شامل حیاط و کانتر که نظافت حیاط و بخش کانتر سالن را بر عهده دارد؛ کانتر محل تمیز کردن و نگهداری سینی‌ها و تفکیک پسماند است."},{"name":"باکس طبقه بالا","description":"یکی از باکس‌های نظافتی شعبه بالا (ناهارخوران) شامل کل طبقه بالا که میزها، کف و سرویس بهداشتی و آینه آن طبق ترتیب بهره‌ورانه تمیز می‌شود."},{"name":"باکس طبقه پایین","description":"یکی از باکس‌های نظافتی شعبه بالا شامل طبقه پایین به‌همراه بخشی از راه‌پله، سرویس، اتاق سرور و اتاقک پشت صندوق که نظافت و آماده‌سازی آن انجام می‌شود."},{"name":"باکس حیاط و تراس","description":"باکس نظافتی تراس شعبه بالا شامل گلدان‌ها و شیشه‌های تراس؛ گلدان‌ها آب داده و شیشه‌های کرکره‌ای و شیشه محافظ پرتگاه از سمت بیرون با راپل تمیز می‌شوند."},{"name":"کیوسک","description":"بخش ثبت سفارش خودگردان مشتری در ورودی سالن که مشتری در آن سفارش سالن یا بیرون‌بر را ثبت و شماره استند و تعداد نفرات را وارد می‌کند؛ کیوسک‌من مسئول خوشامدگویی و راهنمایی مشتری در این بخش است."}],"personnel":[{"role":"سرپرست سالن","duties":["نظارت و هدایت و مدیریت کار پرسنل سالن و تقسیم و بازتقسیم وظایف روزانه","کنترل و بازبینی اتمام نظافت و چک‌لیست‌ها پیش از شروع سرویس‌دهی و در پایان شب","رسیدگی به شکایات، اعتراضات و بازخوردهای مشتریان و ثبت و گزارش آن‌ها به مدیریت","رسیدگی به مهمانان ویژه و وی‌آی‌پی و سفارش‌گیری دستی و حضوری برای آن‌ها","برگزاری جلسات و آموزش هفتگی پرسنل بر اساس لیست و برنامه آموزشی مدیریت","بررسی موجودی سالن و ثبت سفارش آخر شب برای تأمین کمبودها","مدیریت زمان و محل نشستن مشتریان در ساعات شلوغی و مدیریت نوبت انتظار","برقراری ارتباط با آشپزخانه و صندوق طبق اصل وحدت فرماندهی و مدیریت تنش‌های بین‌بخشی","ایفای نقش پرسنل غایب در روزهای آف و ایستادن به‌جای کیوسک‌من هنگام غیبت او","کنترل چیدمان و زیبایی سالن و نظارت بر رعایت استانداردهای نظافت و بهداشت","نظارت بر نظافت و آراستگی شخصی پرسنل"],"kpi":["برگزاری حداقل چهار جلسه آموزشی برای کارکنان در ماه","ثبت هر شکایت مشتری و ارائه گزارش آن به مدیر تا پایان روز","حداقل دو بار بازدید از نقاط کلیدی سالن و رفع نواقص حداکثر تا پایان سه روز با اطلاع‌رسانی به مدیر رستوران","دریافت و تحویل ۹۵٪ سفارش‌ها بدون اشتباه یا تأخیر به‌همراه گزارش هفتگی از عملکرد تیم","بررسی فهرست ملزومات هر دو روز یک‌بار و درخواست موجودی کمتر از حد تعیین‌شده ظرف ۲۴ ساعت","تحویل گزارش هفتگی عملکرد سالن، مشکلات و    No randomness, no dates, no AI, no text rewriting.
   ============================================================ */

const FA=['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const toFa=(x)=>String(x).replace(/[0-9]/g,d=>FA[d]);
const esc=(s)=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const svg=(d,s=24,w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

/** Deterministic graph model: back-edge detection + topological ranking. */
function graphOf(p){
  const nodes=p.nodes||[], edges=(p.edges||[]).map((e,i)=>({from:e.from,to:e.to,label:e.label||'',i}));
  const byId={}; nodes.forEach((n,i)=>{ byId[n.id]={n,i}; });
  const out={}, inn={};
  nodes.forEach(n=>{ out[n.id]=[]; inn[n.id]=[]; });
  edges.forEach(e=>{ if(byId[e.from]&&byId[e.to]){ out[e.from].push(e); inn[e.to].push(e); } });
  Object.keys(out).forEach(k=>out[k].sort((a,b)=>a.i-b.i));

  let start=nodes.find(n=>n.type==='start');
  if(!start) start=nodes.find(n=>inn[n.id].length===0)||nodes[0];

  // back edges via DFS in stable order
  const color={}, back={};
  const dfs=(id)=>{ color[id]=1;
    out[id].forEach(e=>{ const c=color[e.to]; if(c===1) back[e.i]=true; else if(!c) dfs(e.to); });
    color[id]=2; };
  if(start) dfs(start.id);
  nodes.forEach(n=>{ if(!color[n.id]) dfs(n.id); });

  const fwdOut=(id)=>out[id].filter(e=>!back[e.i]);
  const backOut=(id)=>out[id].filter(e=>back[e.i]);

  // topological rank (Kahn, lowest original index first)
  const indeg={}; nodes.forEach(n=>{ indeg[n.id]=0; });
  nodes.forEach(n=>fwdOut(n.id).forEach(e=>{ indeg[e.to]++; }));
  const ready=nodes.filter(n=>indeg[n.id]===0).map(n=>n.id);
  const rank={}; let r=0;
  while(ready.length){
    ready.sort((a,b)=>byId[a].i-byId[b].i);
    const id=ready.shift(); rank[id]=r++;
    fwdOut(id).forEach(e=>{ if(--indeg[e.to]===0) ready.push(e.to); });
  }
  nodes.forEach(n=>{ if(rank[n.id]==null) rank[n.id]=r++; });

  return {nodes,byId,out,inn,start,fwdOut,backOut,rank};
}

/** First node reachable from every branch (deterministic merge point). */
function mergePoint(g,branchEdges){
  const sets=branchEdges.map(e=>{
    const seen={}, stack=[e.to];
    while(stack.length){ const id=stack.pop(); if(seen[id])continue; seen[id]=true;
      g.fwdOut(id).forEach(x=>{ if(!seen[x.to]) stack.push(x.to); }); }
    return seen;
  });
  const common=Object.keys(sets[0]).filter(id=>sets.every(s=>s[id]));
  if(!common.length) return null;
  common.sort((a,b)=>(g.rank[a]-g.rank[b])||(g.byId[a].i-g.byId[b].i));
  return common[0];
}

const GROUP_TITLE={
  XOR:'فقط یکی از این‌ها انجام می‌شود',
  AND:'هر دو با هم انجام می‌شوند',
  OR:'یک مورد یا چند مورد از این‌ها انجام می‌شود'
};
function groupTitle(type,count){
  if(type==='AND') return count>2?'همهٔ این‌ها با هم انجام می‌شوند':GROUP_TITLE.AND;
  return GROUP_TITLE[type]||GROUP_TITLE.XOR;
}

/** Pure: process JSON -> ordered block tree. */
function linearize(p){
  const g=graphOf(p);
  const visited={};
  function walk(fromId,stopId,cond){
    const blocks=[]; let cur=fromId, pending=cond||'';
    let guard=0;
    while(cur && cur!==stopId && guard++<g.nodes.length*4){
      if(visited[cur]&&g.byId[cur].n.type==='activity') break;
      const node=g.byId[cur]&&g.byId[cur].n; if(!node) break;
      if(node.type==='activity'){
        visited[cur]=true;
        blocks.push({kind:'step',node,cond:pending,back:g.backOut(cur).map(e=>({to:e.to,label:e.label}))});
        pending='';
      }
      const outs=g.fwdOut(cur);
      if(!outs.length) break;
      if(outs.length===1){ pending=outs[0].label||pending; cur=outs[0].to; continue; }
      const merge=mergePoint(g,outs);
      blocks.push({kind:'group',type:(node.junctionType||'XOR'),
        branches:outs.map(e=>({label:e.label||'',blocks:walk(e.to,merge,'')}))});
      if(!merge) break;
      cur=merge; pending='';
    }
    return blocks;
  }
  const blocks=walk(g.start?g.start.id:null,null,'');
  // graphs can have disconnected pieces — append them in stable node order
  g.nodes.forEach(n=>{
    if(n.type!=='activity'||visited[n.id]) return;
    walk(n.id,null,'').forEach(b=>blocks.push(b));
  });

  // number steps in reading order; then resolve back-references
  let n=0; const numOf={};
  (function num(bs){ bs.forEach(b=>{ if(b.kind==='step'){ b.num=++n; numOf[b.node.id]=b.num; } else b.branches.forEach(br=>num(br.blocks)); }); })(blocks);
  (function res(bs){ bs.forEach(b=>{ if(b.kind==='step'){ b.backNums=(b.back||[]).map(x=>numOf[x.to]).filter(Boolean); }
    else b.branches.forEach(br=>res(br.blocks)); }); })(blocks);
  return blocks;
}

/* ============================================================
   RENDER
   ============================================================ */
const PMAP={}; DATA.processes.forEach(p=>{ PMAP[p.id]=p; });
const MODEL={}; DATA.processes.forEach(p=>{ MODEL[p.id]=linearize(p); });

const icoUser=svg('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',19);
const icoChev=svg('<path d="M9 18l6-6-6-6"/>',20,2.6);
const icoChevL=svg('<path d="M15 18l-6-6 6-6"/>',20,2.6);
const icoBack=svg('<path d="M9 14l-4-4 4-4"/><path d="M5 10h9a4 4 0 0 1 0 8h-1"/>',16);
const icoCheck=svg('<path d="M20 6L9 17l-5-5"/>',20,3);
const icoProc=svg('<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 9h8M8 13h5"/>',20);
const icoSub=svg('<path d="M4 4v7a4 4 0 0 0 4 4h9"/><path d="M14 11l4 4-4 4"/>',20);
const icoTap=svg('<path d="M9 11V6a2 2 0 1 1 4 0v9"/><path d="M13 12h3a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3h-4l-4-4-2-4a1.5 1.5 0 0 1 2.4-1.8L9 13"/>',20);

function renderBlocks(blocks,pid){
  return blocks.map(b=>{
    if(b.kind==='group'){
      const glyph=b.type==='AND'?'&':(b.type==='OR'?'O':'X');
      return `<div class="grp">
        <div class="grp-h"><span class="gi">${glyph}</span>${esc(groupTitle(b.type,b.branches.length))}</div>
        ${b.branches.map((br,i)=>`<div class="branch">
          <div class="branch-h"><span class="bl">${toFa(i+1)}</span>${br.label?('اگر: '+esc(br.label)):'حالت '+toFa(i+1)}</div>
          ${br.blocks.length?`<div class="steps">${renderBlocks(br.blocks,pid)}</div>`:`<div class="nothing">کاری لازم نیست</div>`}
        </div>`).join('')}
      </div>`;
    }
    const n=b.node, sub=n.subprocess&&PMAP[n.subprocess];
    const badges=[
      b.cond?`<span class="bdg cond">اگر: ${esc(b.cond)}</span>`:'',
      (b.backNums||[]).map(x=>`<span class="bdg back" role="button" tabindex="0" onclick="event.stopPropagation();jumpStep(${x})">${icoBack} برگرد به مرحلهٔ ${toFa(x)}</span>`).join(''),
      sub?`<span class="bdg sub">${icoChev} مراحل این کار را ببین</span>`:''
    ].join('');
    const click=sub?`openSub('${n.subprocess}','${pid}','${n.id}')`:`toggleStep(this)`;
    return `<div class="step${sub?' has-sub':''}" id="stp-${b.num}">
      <button class="step-row" onclick="${click}">
        <span class="sn">${toFa(b.num)}</span>
        <span class="st"><span class="label">${esc(n.label)}</span>${badges?`<span class="badges">${badges}</span>`:''}</span>
        <span class="chev">${icoChevL}</span>
      </button>
      ${sub?'':`<div class="step-body">
        ${n.actor?`<div class="fld"><span class="k">این کار را چه کسی انجام می‌دهد؟</span><span class="actor">${icoUser}${esc(n.actor)}</span></div>`:''}
        ${n.description?`<div class="fld"><span class="k">توضیح کار</span><div class="v">${esc(n.description)}</div></div>`:''}
      </div>`}
    </div>`;
  }).join('');
}

function pageHtml(pid,trail){
  const p=PMAP[pid]; if(!p) return '';
  const parentNode=trail.length?trail[trail.length-1].node:null;
  const crumbs=trail.length
    ? `<div class="crumbs">${trail.map((t,i)=>`<span onclick="openPath(${i})" style="cursor:pointer">${esc(PMAP[t.pid].name)}</span><span class="sep">›</span>`).join('')}<b>${esc(p.name)}</b></div>`
    : '';
  const back=trail.length?`<button class="backbtn" onclick="goBack()">${icoChev} بازگشت</button>`:`<button class="backbtn" onclick="goHome()">${icoChev} بازگشت به فهرست کارها</button>`;
  const summary=parentNode&&parentNode.description
    ? `<div class="page-sum"><span class="sl">این بخش مربوط به چیست؟</span>${esc(parentNode.description)}</div>` : '';
  return `${back}${crumbs}
    <h1 class="page-title">${esc(p.name)}</h1>
    ${summary}
    <div class="howto">${icoTap} روی هر مرحله بزنید تا توضیح کامل و مسئول آن را ببینید.</div>
    <div class="steps">${renderBlocks(MODEL[pid],pid)}</div>
    <div class="endmark"><span class="ei">${icoCheck}</span>کار تمام شد</div>`;
}

/* ---- navigation ---- */
let TRAIL=[];
const app=document.getElementById('app');
function homeHtml(){
  return `<div class="home-head"><h1>راهنمای گام‌به‌گام کار</h1><p>واحد ${esc(DATA.dept.name)} — روی نام هر کار بزنید تا مرحله‌به‌مرحله ببینید.</p></div>
  <div class="plist">${DATA.processes.map((p,i)=>{
    const steps=MODEL[p.id].length?countSteps(MODEL[p.id]):0;
    return `<button class="pbtn" onclick="openProc('${p.id}')">
      <span class="pn ${p.parent?"sub":""}">${p.parent?icoSub:icoProc}</span>
      <span class="pt">${esc(p.name)}<span class="ptag ${p.parent?"sub":""}">${p.parent?"زیرفرآیند":"فرآیند"}</span></span>
      <span class="pc">${toFa(steps)} مرحله</span>
      <span class="pg">${icoChevL}</span>
    </button>`;}).join('')}</div>`;
}
function countSteps(bs){ let n=0; bs.forEach(b=>{ if(b.kind==='step')n++; else b.branches.forEach(br=>{n+=countSteps(br.blocks);}); }); return n; }
function render(){
  if(!TRAIL.length){ app.innerHTML=`<div class="view active">${homeHtml()}</div>`; }
  else{ const cur=TRAIL[TRAIL.length-1]; app.innerHTML=`<div class="view active">${pageHtml(cur.pid,TRAIL.slice(0,-1))}</div>`; }
  window.scrollTo(0,0);
}
function goHome(){ TRAIL=[]; render(); }
function openProc(pid){ TRAIL=[{pid,node:null}]; render(); }
function openSub(subId,parentPid,nodeId){
  const pn=(PMAP[parentPid].nodes||[]).find(n=>n.id===nodeId)||null;
  TRAIL.push({pid:subId,node:pn}); render();
}
function goBack(){ TRAIL.pop(); render(); }
function openPath(i){ TRAIL=TRAIL.slice(0,i+1); render(); }
function jumpStep(n){
  const el=document.getElementById('stp-'+n); if(!el) return;
  el.classList.add('open','flash');
  const y=el.getBoundingClientRect().top+window.scrollY-90;
  window.scrollTo({top:y<0?0:y,behavior:'smooth'});
  setTimeout(()=>el.classList.remove('flash'),1600);
}
function toggleStep(btn){ btn.parentElement.classList.toggle('open'); }

/* ---- print document: static, always present, print-only ---- */
function printBlocks(bs){
  return bs.map(b=>{
    if(b.kind==='group'){
      return '<div class="pgrp"><div class="h">'+esc(groupTitle(b.type,b.branches.length))+'</div>'
        +b.branches.map((br,i)=>'<div class="pbr"><div class="h">'+(br.label?('اگر: '+esc(br.label)):('حالت '+toFa(i+1)))+'</div>'
          +(br.blocks.length?printBlocks(br.blocks):'<div class="pnone">کاری لازم نیست</div>')+'</div>').join('')
        +'</div>';
    }
    const n=b.node, sub=n.subprocess&&PMAP[n.subprocess];
    const tags=[
      b.cond?'<span class="tg cond">اگر: '+esc(b.cond)+'</span>':'',
      (b.backNums||[]).map(x=>'<span class="tg back">برگرد به مرحلهٔ '+toFa(x)+'</span>').join(''),
      sub?'<span class="tg sub">مراحل این کار: بخش «'+esc(PMAP[n.subprocess].name)+'»</span>':''
    ].join('');
    return '<div class="pstep'+(sub?' sub':'')+'"><span class="n">'+toFa(b.num)+'</span><span class="c">'
      +'<span class="l">'+esc(n.label)+'</span>'
      +(n.actor?'<div class="m">مجری: '+esc(n.actor)+'</div>':'')
      +(n.description?'<div class="d">'+esc(n.description)+'</div>':'')
      +(tags?'<div class="tags">'+tags+'</div>':'')
      +'</span></div>';
  }).join('');
}
function buildPrintDoc(){
  const host=document.getElementById('printdoc');
  const index='<section class="psec pindex">'
    +'<h2>راهنمای گام‌به‌گام کار — واحد '+esc(DATA.dept.name)+'</h2>'
    +'<div class="ptype">فهرست کارها</div>'
    +'<ol class="plist-print">'
    +DATA.processes.map(p=>'<li class="'+(p.parent?'sub':'')+'">'
      +'<span class="il">'+esc(p.name)+'</span>'
      +'<span class="it'+(p.parent?' sub':'')+'">'+(p.parent?'زیرفرآیند':'فرآیند')+'</span>'
      +'<span class="ic">'+toFa(countSteps(MODEL[p.id]))+' مرحله</span>'
    +'</li>').join('')
    +'</ol></section>';
  host.innerHTML=index+DATA.processes.map(p=>{
    const parents=DATA.processes.filter(x=>(x.nodes||[]).some(n=>n.subprocess===p.id));
    const pn=parents.length?(parents[0].nodes.find(n=>n.subprocess===p.id)||null):null;
    return '<section class="psec"><h2>'+esc(p.name)+'</h2>'
      +'<div class="ptype'+(p.parent?' sub':'')+'">'+(p.parent?'زیرفرآیند':'فرآیند')+'</div>'
      +(pn&&pn.description?'<div class="psum"><b>این بخش مربوط به چیست؟</b>'+esc(pn.description)+'</div>':'')
      +printBlocks(MODEL[p.id])
      +'<div class="pend">کار تمام شد</div></section>';
  }).join('');
}
buildPrintDoc();

render();
</script>
</body>
