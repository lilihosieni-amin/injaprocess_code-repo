<!-- @dsCard group="Components" viewport="700x200" name="Forms" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-app);padding:18px;direction:rtl;color:var(--text-strong)}
.wrap{display:flex;flex-direction:column;gap:14px;max-width:360px}
.lbl{font-size:11.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px}
.inp{width:100%;box-sizing:border-box;padding:9px 12px;border:1.5px solid #E3D8F5;border-radius:10px;font-family:inherit;font-size:13px;color:#2A1D5E;background:#fff}
.inpf{border-color:#FA5A52}
.search{position:relative}
.search input{padding-right:34px}
.search svg{position:absolute;right:11px;top:50%;transform:translateY(-50%)}
.tg{display:flex;align-items:center;gap:8px}
.track{position:relative;width:38px;height:22px;border-radius:20px;background:#1F8A5B}
.knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}</style></head>
<body><div class="wrap">
  <div><div class="lbl">نام فرآیند</div><input class="inp" value="پخت غذای روز"></div>
  <div class="search"><input class="inp inpf" placeholder="جست‌وجوی نام یا شناسه…"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a99fc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg></div>
  <div class="tg"><span class="track"><span class="knob"></span></span><span style="font-size:12.5px;font-weight:700">این فرآیند یک زیرفرآیند است</span></div>
</div></body></html>
