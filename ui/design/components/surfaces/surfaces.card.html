<!-- @dsCard group="Components" viewport="700x300" name="Surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-app);padding:18px;direction:rtl;color:var(--text-strong)}
.wrap{display:flex;gap:16px;align-items:flex-start}
.dept{position:relative;overflow:hidden;width:260px;background:#fff;border:1px solid #EFE7DC;border-radius:20px;padding:22px;box-shadow:var(--shadow-card-lg)}
.bar{position:absolute;top:0;right:0;left:0;height:4px;background:#4A25A9}
.idx{position:absolute;top:14px;left:20px;font-size:46px;font-weight:800;line-height:1;color:#EDE4FA}
.tile{width:48px;height:48px;border-radius:14px;background:#F0E9FB;color:#4A25A9;display:flex;align-items:center;justify-content:center}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:15px;border-top:1px solid #F2ECE3}
.chev{width:34px;height:34px;border-radius:50%;background:#F3EDFC;color:#4A25A9;display:flex;align-items:center;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:#6B5CA5;background:#F5F1FB;padding:4px 10px;border-radius:20px}
.row{flex:1;background:#fff;border:1px solid #EFE7DC;border-radius:16px;padding:17px 19px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-row)}
.tag{font-size:10.5px;color:#4A25A9;background:#F0E9FB;padding:2px 8px;border-radius:20px;font-weight:600}
.mono{font-family:var(--font-mono);font-size:11px;color:#a99fc4;direction:ltr;margin-top:4px}
.sbtn{font-weight:700;border-radius:10px;padding:7px 12px;font-size:12px;border:1.5px solid}</style></head>
<body><div class="wrap">
  <div class="dept">
    <div class="bar"></div><div class="idx">۰۲</div>
    <div class="tile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2l1.5 20h15L21 2M3 7h18"></path></svg></div>
    <div style="font-weight:800;font-size:18px;margin-top:16px">دپارتمان پخت</div>
    <div style="margin-top:11px"><span class="pill">۶ فرآیند</span></div>
    <div class="foot"><span style="font-size:12.5px;font-weight:700;color:#4A25A9">مشاهدهٔ فرآیندها</span><span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></span></div>
  </div>
  <div class="row">
    <div style="flex:1">
      <div style="display:flex;align-items:center;gap:9px"><span style="font-weight:700;font-size:15px">خرید و پرداخت هزینه</span><span class="tag">مستند</span></div>
      <div class="mono">cooking-001</div>
    </div>
    <div style="text-align:center"><div style="font-weight:800;font-size:17px;color:#4A25A9">۸</div><div style="font-size:10.5px;color:#8a7db0">فعالیت</div></div>
    <div style="display:flex;gap:8px">
      <button class="sbtn" style="background:#fff;color:#6B5CA5;border-color:#E3D8F5">اطلاعات کلی</button>
      <button class="sbtn" style="background:#4A25A9;color:#fff;border-color:#4A25A9">فلوچارت</button>
    </div>
  </div>
</div></body></html>
