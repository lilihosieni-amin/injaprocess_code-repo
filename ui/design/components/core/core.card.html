<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-app);padding:18px;direction:rtl;color:var(--text-strong)}
.wrap{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;font-weight:700;border-radius:12px;cursor:pointer;padding:9px 15px;font-size:13px;border:1.5px solid transparent}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px}
.dot{width:6px;height:6px;border-radius:50%}
.ib{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;cursor:pointer}</style></head>
<body><div class="wrap">
  <div class="row">
    <button class="btn" style="background:#4A25A9;color:#fff">ذخیره</button>
    <button class="btn" style="background:#FA5A52;color:#fff">افزودن فعالیت</button>
    <button class="btn" style="background:#E23D35;color:#fff;box-shadow:var(--shadow-coral)">حذف کامل</button>
    <button class="btn" style="background:#1F8A5B;color:#fff">پذیرفتن</button>
    <button class="btn" style="background:#fff;color:#6B5CA5;border-color:#E3D8F5">انصراف</button>
    <button class="btn" style="background:transparent;color:#4A25A9">بازگشت</button>
  </div>
  <div class="row">
    <span class="pill" style="color:#4A25A9;background:#F0E9FB">مستند</span>
    <span class="pill" style="color:#B4690E;background:#FBEEDC">زیرفرآیند</span>
    <span class="pill" style="color:#1F8A5B;background:#E4F6EC">دارای KPI</span>
    <span class="pill" style="color:#E23D35;background:#FDE7E5"><span class="dot" style="background:#FA5A52"></span>۲ تعارض باز</span>
    <span class="pill" style="font-family:var(--font-mono);color:#fff;background:#4A25A9;direction:ltr">cooking-001</span>
    <span class="ib" style="background:#FFF3F2;color:#E23D35;border:1.5px solid #FDD9D6"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"></path></svg></span>
  </div>
</div></body></html>
