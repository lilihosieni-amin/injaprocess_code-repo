<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Base spacing steps (4 → 40px)" name="Spacing scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-app);padding:18px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.c{display:flex;flex-direction:column;align-items:center;gap:5px}
.bar{background:#4A25A9;border-radius:4px;height:34px}
.l{font-size:10.5px;color:var(--text-muted);font-family:var(--font-mono)}</style></head>
<body><div class="row">
  <div class="c"><div class="bar" style="width:4px"></div><span class="l">4</span></div>
  <div class="c"><div class="bar" style="width:8px"></div><span class="l">8</span></div>
  <div class="c"><div class="bar" style="width:10px"></div><span class="l">10</span></div>
  <div class="c"><div class="bar" style="width:12px"></div><span class="l">12</span></div>
  <div class="c"><div class="bar" style="width:16px"></div><span class="l">16</span></div>
  <div class="c"><div class="bar" style="width:22px"></div><span class="l">22</span></div>
  <div class="c"><div class="bar" style="width:30px"></div><span class="l">30</span></div>
  <div class="c"><div class="bar" style="width:40px"></div><span class="l">40</span></div>
</div></body></html>
