<!-- @dsCard group="Colors" viewport="700x150" subtitle="Cream surfaces, warm + violet borders" name="Surfaces & Borders" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-app);padding:16px}
.row{display:flex;gap:12px}
.sw{flex:1;border-radius:12px;padding:12px;height:92px;display:flex;flex-direction:column;justify-content:flex-end}
.n{font-size:12px;font-weight:700;color:var(--text-strong)}.h{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head>
<body><div class="row">
  <div class="sw" style="background:#FBF7F1;border:1px solid var(--border-warm)"><div class="n">app</div><div class="h">#FBF7F1</div></div>
  <div class="sw" style="background:#FFFFFF;border:1px solid var(--border-warm)"><div class="n">card</div><div class="h">#FFFFFF</div></div>
  <div class="sw" style="background:#F0E9FB;border:1px solid var(--border-violet)"><div class="n">violet-soft</div><div class="h">#F0E9FB</div></div>
  <div class="sw" style="background:#FFE9E7;border:1px solid #F5C9C5"><div class="n">coral-soft</div><div class="h">#FFE9E7</div></div>
  <div class="sw" style="background:#fff;border:3px solid #EFE7DC"><div class="n">border-warm</div><div class="h">#EFE7DC</div></div>
  <div class="sw" style="background:#fff;border:3px solid #E3D8F5"><div class="n">border-violet</div><div class="h">#E3D8F5</div></div>
</div></body></html>
