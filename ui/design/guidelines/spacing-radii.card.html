<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Radius scale: chip → panel" name="Radii" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-app);padding:18px}
.row{display:flex;gap:14px;align-items:flex-end}
.b{background:#fff;border:1px solid var(--border-warm);width:84px;height:70px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;box-shadow:var(--shadow-row)}
.l{font-size:11px;color:var(--text-muted);font-weight:600}</style></head>
<body><div class="row">
  <div class="b" style="border-radius:7px"><span class="l">7 chip</span></div>
  <div class="b" style="border-radius:10px"><span class="l">10 ctrl</span></div>
  <div class="b" style="border-radius:14px"><span class="l">14 tile</span></div>
  <div class="b" style="border-radius:16px"><span class="l">16 card</span></div>
  <div class="b" style="border-radius:20px"><span class="l">20 feat</span></div>
  <div class="b" style="border-radius:24px"><span class="l">24 panel</span></div>
</div></body></html>
