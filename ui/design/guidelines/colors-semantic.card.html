<!-- @dsCard group="Colors" viewport="700x150" subtitle="Success / danger / warning / info + soft pairs" name="Semantic" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-app);padding:16px}
.row{display:flex;gap:12px}
.sw{flex:1;border-radius:12px;overflow:hidden;border:1px solid var(--border-warm)}
.top{height:52px}.bot{padding:8px 10px}
.n{font-size:12px;font-weight:700;color:var(--text-strong)}.h{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}</style></head>
<body><div class="row">
  <div class="sw"><div class="top" style="background:#1F8A5B"></div><div class="bot" style="background:#E4F6EC"><div class="n">ok</div><div class="h">#1F8A5B</div></div></div>
  <div class="sw"><div class="top" style="background:#E23D35"></div><div class="bot" style="background:#FDE7E5"><div class="n">danger</div><div class="h">#E23D35</div></div></div>
  <div class="sw"><div class="top" style="background:#B4690E"></div><div class="bot" style="background:#FBEEDC"><div class="n">warn</div><div class="h">#B4690E</div></div></div>
  <div class="sw"><div class="top" style="background:#1F6FB2"></div><div class="bot" style="background:#E7F1FB"><div class="n">info</div><div class="h">#1F6FB2</div></div></div>
</div></body></html>
