<!-- @dsCard group="Colors" viewport="700x150" subtitle="Brand violet + coral from the logo" name="Brand" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-app);padding:16px}
.row{display:flex;gap:12px}
.sw{flex:1;border-radius:12px;padding:14px 12px;height:92px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--border-warm)}
.n{font-size:12px;font-weight:700}.h{font-family:var(--font-mono);font-size:11px;opacity:.85}</style></head>
<body><div class="row">
  <div class="sw" style="background:#4A25A9;color:#fff"><div class="n">violet</div><div class="h">#4A25A9</div></div>
  <div class="sw" style="background:#2A1D5E;color:#fff"><div class="n">violet-ink</div><div class="h">#2A1D5E</div></div>
  <div class="sw" style="background:#2E1668;color:#fff"><div class="n">violet-deep</div><div class="h">#2E1668</div></div>
  <div class="sw" style="background:#FA5A52;color:#fff"><div class="n">coral</div><div class="h">#FA5A52</div></div>
  <div class="sw" style="background:#E23D35;color:#fff"><div class="n">coral-ink</div><div class="h">#E23D35</div></div>
</div></body></html>
