<!-- @dsCard group="Colors" viewport="700x150" subtitle="IDEF0 ICOM roles + flowchart junctions" name="ICOM & Junctions" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-app);padding:16px;direction:rtl}
.wrap{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;padding:5px 12px;border-radius:7px;white-space:nowrap;font-weight:600}
.j{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-strong);font-weight:700}
.d{width:22px;height:22px;transform:rotate(45deg);border-radius:4px}</style></head>
<body><div class="wrap">
  <div class="row">
    <span class="chip" style="color:#1F6FB2;background:#E7F1FB">ورودی — input</span>
    <span class="chip" style="color:#8A5A00;background:#FBF0DA">کنترل — control</span>
    <span class="chip" style="color:#1F8A5B;background:#E4F6EC">خروجی — output</span>
    <span class="chip" style="color:#4A25A9;background:#F0E9FB">مکانیزم — mechanism</span>
  </div>
  <div class="row" style="gap:22px">
    <span class="j"><span class="d" style="background:#FA5A52"></span>XOR</span>
    <span class="j"><span class="d" style="background:#4A25A9"></span>AND</span>
    <span class="j"><span class="d" style="background:#E8A33D"></span>OR</span>
  </div>
</div></body></html>
