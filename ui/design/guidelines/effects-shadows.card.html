<!-- @dsCard group="Effects" viewport="700x170" subtitle="Violet-tinted soft shadows" name="Shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-app);padding:22px}
.row{display:flex;gap:20px}
.b{flex:1;background:#fff;border:1px solid var(--border-warm);border-radius:16px;height:88px;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--text-muted);font-weight:600;text-align:center;padding:0 8px}</style></head>
<body><div class="row">
  <div class="b" style="box-shadow:var(--shadow-row)">row<br>-9 / .25</div>
  <div class="b" style="box-shadow:var(--shadow-card-lg)">card<br>-12 / .28</div>
  <div class="b" style="box-shadow:var(--shadow-hover)">hover<br>-14 / .45</div>
  <div class="b" style="box-shadow:var(--shadow-pop)">popover<br>-16 / .5</div>
</div></body></html>
