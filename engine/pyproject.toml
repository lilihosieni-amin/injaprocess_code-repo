[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inja-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema~=4.23", "python-docx~=1.1", "jdatetime~=5.0"]

[project.optional-dependencies]
# Needed by `transcribe` (audio) and by extract-attachment's `.pdf`/image rows (QF-30) —
# not extract-attachment's `.docx` path, which stays stdlib + python-docx only.
vertex = ["google-genai~=2.19", "google-cloud-storage~=2.18"]

[project.scripts]
allocate-id = "allocate_id.cli:main"
dump-workbook = "dump_workbook.cli:main"
extract-attachment = "extract_attachment.cli:main"
facts-plan = "facts_plan.cli:main"
layout = "layout.cli:main"
merge = "merge.cli:main"
order = "order.cli:main"
transcribe = "transcribe.cli:main"
validate = "validate.cli:main"

[tool.setuptools.packages.find]
include = ["engine_common*", "allocate_id*", "dump_workbook*", "extract_attachment*", "facts_plan*", "layout*", "merge*", "merge_facts*", "order*", "transcribe*", "validate*"]

# The expression and style cards are prose the units read, kept as files so the
# prompt is reviewable and testable against the checker it transcribes (§2.4).
[tool.setuptools.package-data]
facts_plan = ["cards/*.md"]
