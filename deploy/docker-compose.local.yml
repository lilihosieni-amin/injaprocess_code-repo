# LOCAL TESTING stack — run from code-repo/deploy:
#   docker compose -f docker-compose.local.yml up -d --build upload-bot
#   docker compose -f docker-compose.local.yml up -d --build control-bot
#   docker compose -f docker-compose.local.yml up -d --build ui-backend   # UI at http://localhost:8001
#
# Fully isolated from the server stack (deploy/docker-compose.yml):
#   - distinct project name + its own local volumes
#   - local ./local/*.env (test bot tokens, gitignored) instead of /opt/inja/secrets
#   - the sibling ../../data-repo mounted at /data (no /opt/inja paths)
#   - public Telegram Bot API (<=20MB); no telegram-bot-api, git-push
#   - ui-backend served over plain HTTP on :8001 (no Caddy/TLS proxy — the login
#     cookie has no Secure flag, so http://localhost works for local testing)
# Nothing here touches the server host or the production bots.
name: inja-food-process-local

# Same cap as the server stack (docker-compose.yml) — json-file is unbounded by
# default, and a local ui-backend serves the same unauthenticated
# /api/exports/login that logs a WARNING per failed attempt. Kept identical so a
# local run is not quietly a different deployment from the server one.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  upload-bot:
    build:
      context: ..
      dockerfile: deploy/upload-bot.Dockerfile
    image: inja-upload-bot-local
    restart: unless-stopped
    logging: *default-logging
    env_file: [./local/upload-bot.env]     # test token @uploadtestinjsbot
    environment:
      DATA_ROOT: /data
      # (No TELEGRAM_API_BASE_URL -> uses public api.telegram.org, 20MB file cap.)
      VERTEX_PROJECT: injafood
      VERTEX_LOCATION: global
      GEMINI_MODEL: gemini-3.1-pro-preview
      GCS_BUCKET: injafood-transcribe-staging
      # The host's own gcloud ADC, read-only. Needs a quota project set once:
      #   gcloud auth application-default set-quota-project injafood
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
      GOOGLE_CLOUD_PROJECT: injafood
      # No proxy vars, deliberately: every outbound host this bot talks to —
      # Telegram, Vertex, GCS — is reached directly from this machine.
    volumes:
      - "../../data-repo:/data"
      - "${HOME}/.config/gcloud:/root/.config/gcloud:ro"

  control-bot:
    build:
      context: ..
      dockerfile: deploy/control-bot.Dockerfile
    image: inja-control-bot-local
    restart: unless-stopped
    logging: *default-logging
    env_file: [./local/control-bot.env]    # test token @aiprocessTestinjabo
    environment:
      APPROVED_DIRECTORY: /data
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
      CLAUDE_MAX_TURNS: "300"
      BASH_DEFAULT_TIMEOUT_MS: "600000"
      BASH_MAX_TIMEOUT_MS: "600000"
      # Same Vertex settings as upload-bot: the pipeline transcribes any recording
      # that arrived without a raw transcript.
      VERTEX_PROJECT: injafood
      VERTEX_LOCATION: global
      GEMINI_MODEL: gemini-3.1-pro-preview
      GCS_BUCKET: injafood-transcribe-staging
      # The host's own gcloud ADC, read-only. Needs a quota project set once:
      #   gcloud auth application-default set-quota-project injafood
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
      GOOGLE_CLOUD_PROJECT: injafood
      # No proxy vars, deliberately: every outbound host — Telegram, Anthropic,
      # Vertex, GCS — is reached directly from this machine. A SOCKS ALL_PROXY here
      # also breaks `transcribe`: httpx builds the SOCKS transport at client
      # construction, and socksio lives in the bot's uv tool venv, not this python.
    volumes:
      - "../../data-repo:/data"
      - "${HOME}/.config/gcloud:/root/.config/gcloud:ro"
      # Live schemas overlay the image-baked /opt/schemas so the engine `validate`
      # CLI (run by the summarize/process-voice pipeline) picks up schema edits on
      # restart — no image rebuild needed for local iteration.
      - "../schemas:/opt/schemas:ro"
      - local-claude-credentials:/root/.claude   # seeded from host ~/.claude (see setup)
      - local-control-bot-state:/state

  ui-backend:
    # The server-shipped ui-backend.Dockerfile builds FROM node:20-slim. Docker Hub is
    # unreachable from this local machine, so before building here, alias the cached
    # node:18 base to that tag once (Vite 6 supports Node 18) — a local-only docker
    # tag, nothing in the repo changes:
    #   docker tag node:18-bookworm-slim node:20-slim
    build:
      context: ..
      dockerfile: deploy/ui-backend.Dockerfile
    image: inja-ui-backend-local
    restart: unless-stopped
    logging: *default-logging
    # Plain HTTP for local testing — browse http://localhost:8001. No Caddy/TLS.
    # Both session cookies DO carry `Secure`; login works here only because
    # `localhost` is a potentially trustworthy origin. Reach this stack at a LAN IP
    # over plain HTTP instead and login silently stops working — 200 on the POST,
    # 401 on everything after. See deploy/local/README.md § Access.
    ports:
      - "8001:8000"
    # SESSION_SIGNING_KEY, plus EXPORT_USERNAME + EXPORT_PASSWORD_HASH (argon2) if you
    # want to exercise the export login locally. Omit both and /exports answers 401
    # to everyone but a signed-in UI user; nothing else changes. (local, gitignored)
    # `format: raw` for the same reason as the production stack: Compose
    # interpolates env_file values, and every `$` in an argon2 hash would read as
    # a variable reference and silently truncate it. See deploy/docker-compose.yml.
    env_file:
      - path: ./local/ui-backend.env
        format: raw
    environment:
      DATA_ROOT: /data
      # Same reason as the server stack: unset, config.py would put app.db at
      # /app.db in the container's own layer and every local account, session and
      # audit row would vanish on the next `up`. Seed the first Editor with
      #   docker compose -f docker-compose.local.yml run --rm ui-backend \
      #     inja-seed --db /state/app.db --username 09123456789 \
      #               --name "…" --password "…"
      APP_DB: /state/app.db
      # 0, and deliberately: this stack has NO proxy — ui-backend publishes 8001
      # itself, so there is no X-Forwarded-For entry the caller could not have
      # written, and the TCP peer is the honest answer. The server stack sets 1
      # because Caddy sits in front of it there. Stated rather than left to the
      # default so a copy of this file to a proxied host is an obvious edit.
      TRUSTED_PROXY_HOPS: "0"
      EXPORT_DIR: /exports
      # SCHEMA_DIR + UI_STATIC_DIR are baked into the image; the schemas dir is
      # overlaid with the live ../schemas volume below (no rebuild on schema edits).
      # UI edits git-commit into the mounted data-repo, which is owned by the host
      # user; tell git this root-container checkout is safe (avoids "dubious ownership").
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /data
    volumes:
      - "../../data-repo:/data"
      # app.db (accounts, sessions, activity record) — a named volume, so it
      # survives `up -d --build` and never lands in the mounted data-repo.
      - local-ui-state:/state
      # Live schemas overlay the image-baked /app/schemas (backend validates PUTs
      # against these) — schema edits take effect on restart, no rebuild.
      - "../schemas:/app/schemas:ro"
      # Serve the host-built frontend instead of the image-baked bundle, so UI
      # changes show after `npm --prefix ../ui run build` + restart (no image
      # rebuild). Rebuild the image if you'd rather bake the frontend in.
      - "../ui/dist:/app/ui-static:ro"
      # Serve host-built export templates too, so export changes show after
      # `npm --prefix ../ui run build` + restart (no image rebuild).
      - "../ui/dist-export:/app/ui-export-templates:ro"
      # generated export documents — build artifacts, deliberately outside the
      # data-repo so they never appear in its working tree (D8)
      - local-ui-exports:/exports

volumes:
  local-claude-credentials:
  local-control-bot-state:
  local-ui-exports:
  local-ui-state:
