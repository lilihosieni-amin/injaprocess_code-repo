# Full stack (ARD §16). `docker compose up -d` from /opt/inja/code-repo/deploy.
# Build context is the code-repo root (..). data-repo + secrets + keys are host paths.
name: inja-food-process

# Docker's default json-file driver is unbounded, and this host has 3.7 GB of
# disk to lose. `POST /api/exports/login` is unauthenticated and public and logs
# every failed attempt at WARNING; sustained guessing at the rate limiter's own
# ceiling (2 concurrent argon2 checks x ~60 ms = ~33 attempts/s) is ~2.8 M lines
# ≈ 430 MB a day, indefinitely, from outside. 02-secrets-and-auth.md tells the
# operator to read those lines, so they have to survive — 30 MB of them does.
# Every service here writes logs and the cap is per-service, so it goes on all of
# them; singling out ui-backend would only mean the next unbounded writer is a
# different container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest   # community image; entrypoint builds the args from env
    restart: unless-stopped
    logging: *default-logging
    env_file: [/opt/inja/secrets/telegram-bot-api.env]   # TELEGRAM_API_ID / TELEGRAM_API_HASH
    environment:
      TELEGRAM_LOCAL: "1"          # --local mode (up to 2 GB files); serves on :8081
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

  upload-bot:
    build:
      context: ..
      dockerfile: deploy/upload-bot.Dockerfile
    image: inja-upload-bot
    restart: unless-stopped
    logging: *default-logging
    depends_on: [telegram-bot-api]
    env_file: [/opt/inja/secrets/upload-bot.env]         # TELEGRAM_BOT_TOKEN, ALLOWED_USER_IDS
    environment:
      DATA_ROOT: /data
      TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
    volumes:
      - /opt/inja/data-repo:/data
      # local-mode Bot API downloads land in the bot-api server's data dir and
      # getFile returns an absolute path there — mount it (ro) so upload-bot can
      # read the file at that path.
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro

  control-bot:
    build:
      context: ..
      dockerfile: deploy/control-bot.Dockerfile
    image: inja-control-bot
    restart: unless-stopped
    logging: *default-logging
    env_file: [/opt/inja/secrets/control-bot.env]        # TELEGRAM_BOT_TOKEN, ALLOWED_USERS, budgets…
    environment:
      APPROVED_DIRECTORY: /data
      # Disable Claude Code's auto-backgrounding/deferral of Task subagents. On this
      # 2-CPU host the extract subagents run 60–110s; Claude Code was deferring the
      # long ones (interrupted_turn → injected "Continue from where you left off." →
      # "No response requested." stop_sequence), stalling /process-voice mid-extract
      # and forcing manual "ادامه بده" nudges. The pipeline wants agents to run
      # synchronously to completion, so background-tasking is pure downside here.
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
      # Headroom for the long single-turn pipeline (audit: 200 vs ~100–150 real turns
      # is a thin margin on bigger voices). Overrides CLAUDE_MAX_TURNS from the env_file.
      CLAUDE_MAX_TURNS: "300"
      # Per-Bash-command timeout: default is 120s, but `transcribe` on a fresh long
      # audio (Vertex) can exceed 2 min and would otherwise be killed mid-command.
      BASH_DEFAULT_TIMEOUT_MS: "600000"
      BASH_MAX_TIMEOUT_MS: "600000"
    # AC-7 is enforced by the Phase-3 in-container hooks + the bot's can_use_tool
    # callback (setting_sources=["project"], approved_directory=/data): the agent's
    # file operations are confined to /data, and the engine CLIs/code are baked
    # OUTSIDE it (/usr/local/bin, /opt). NOTE: `read_only: true` was attempted for
    # extra defense-in-depth but the Claude CLI's persistent SDK client needs a
    # writable ~/.claude.json in the root home, which cannot be isolated as writable
    # without shadowing the baked bot at /root/.local — so it is intentionally NOT
    # set; the hook + callback confinement is the real guarantee.
    volumes:
      - /opt/inja/data-repo:/data
      - claude-credentials:/root/.claude   # subscription credential (rw)
      - control-bot-state:/state           # bot SQLite state — DATABASE_URL=sqlite:////state/bot.db

  ui-backend:
    build:
      context: ..
      dockerfile: deploy/ui-backend.Dockerfile
    image: inja-ui-backend
    restart: unless-stopped
    logging: *default-logging
    # Defence in depth, not a tuned figure. Worst case in one process is the
    # steady Python service (~150 MB) + one PDF render, which is serialised
    # process-wide and peaks at 300-400 MB (D22), + the export-login argon2
    # ceiling of 2 x 64 MiB (routers/export_files.py) — roughly 700 MB. 1 GiB
    # leaves headroom above that and still leaves ~2.7 GB of this 3.7 GB host for
    # the two bots and everything else. The point is the ceiling: /exports/login
    # is unauthenticated and public, and without a limit a runaway there takes the
    # bots down with it rather than only itself.
    mem_limit: 1g
    # SESSION_SIGNING_KEY, UI_USERS_FILE, and the export credential
    # EXPORT_USERNAME + EXPORT_PASSWORD_HASH (argon2, see docs/runbooks/02-secrets-and-auth.md).
    # The export pair is optional: absent, /exports answers 401 to everyone but a
    # signed-in UI user, and the rest of the UI is unaffected — an unset credential
    # closes the gate, it never opens it and never blocks startup.
    # `format: raw` is load-bearing, not tidiness. Compose interpolates env_file
    # values by default, and an argon2 hash is `$argon2id$v=19$m=...$salt$hash` —
    # every `$` reads as a variable reference, so the hash arrives in the container
    # truncated to whatever precedes the first `$` and the password can never
    # verify. It fails closed (401 for everyone but a signed-in UI user) and looks
    # exactly like "the credential isn't set", which is the worst kind of quiet.
    env_file:
      - path: /opt/inja/secrets/ui-backend.env
        format: raw
    environment:
      DATA_ROOT: /data
      UI_USERS_FILE: /run/secrets/ui-users.json
      EXPORT_DIR: /exports
    volumes:
      - /opt/inja/data-repo:/data
      - /opt/inja/secrets/ui-users.json:/run/secrets/ui-users.json:ro
      # generated export documents — build artifacts, deliberately outside the
      # data-repo so they never appear in its working tree (D8)
      - ui-exports:/exports

  proxy:
    image: caddy:2
    restart: unless-stopped
    logging: *default-logging
    depends_on: [ui-backend]
    ports:
      - "443:443"
    volumes:
      - /opt/inja/code-repo/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    # note: Caddy's own state lives in the caddy-data volume; distinct from data-repo

  git-push:
    build:
      context: ..
      dockerfile: deploy/git-push.Dockerfile
    image: inja-git-push
    restart: unless-stopped
    logging: *default-logging
    # These must match the script defaults in git-push-if-needed.sh: busybox crond
    # does not pass container env into cron jobs, so the script relies on its own
    # defaults (DATA_REPO=/data, GIT_BRANCH=main, DEPLOY_KEY=/keys/id_deploy).
    environment:
      DATA_REPO: /data
      GIT_BRANCH: main
      DEPLOY_KEY: /keys/id_deploy
    volumes:
      - /opt/inja/data-repo:/data
      - /opt/inja/keys:/keys:ro

volumes:
  telegram-bot-api-data:
  claude-credentials:
  control-bot-state:
  caddy-data:
  ui-exports:
